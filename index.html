<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="description" content="Prancheta Bus — jogo de gestão de empresa de ônibus rodoviários">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prancheta Bus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5a524'/%3E%3Crect x='14' y='12' width='36' height='34' rx='6' fill='%231a1205'/%3E%3Crect x='18' y='17' width='28' height='12' rx='2' fill='%23f5a524'/%3E%3Ccircle cx='22' cy='40' r='3' fill='%23f5a524'/%3E%3Ccircle cx='42' cy='40' r='3' fill='%23f5a524'/%3E%3Crect x='18' y='46' width='6' height='6' fill='%231a1205'/%3E%3Crect x='40' y='46' width='6' height='6' fill='%231a1205'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   PRANCHETA BUS — ESTILOS (tema escuro de painel de gestão)
   ===================================================================== */
:root {
  --bg: #0d0f13; --s1: #15181e; --s2: #1c2028; --s3: #252a34; --line: #2b313c;
  --tx: #e8eaef; --mu: #8d95a6; --mu2: #6b7385;
  --ac: #f5a524; --ac2: #ffbf47; --acbg: rgba(245,165,36,.12);
  --ok: #22c55e; --okbg: rgba(34,197,94,.12); --bad: #ef4444; --badbg: rgba(239,68,68,.12);
  --warn: #f59e0b; --info: #60a5fa; --infobg: rgba(96,165,250,.12);
  --r: 14px; --r2: 10px; --nav: 62px; --adv: 58px;
  --sh: 0 10px 30px rgba(0,0,0,.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; overscroll-behavior-y: contain; }
button, input, select { font: inherit; color: inherit; }
.num, .kpi b, td.n, .money { font-variant-numeric: tabular-nums; }
a { color: var(--ac); }
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 18px; } h3 { font-size: 15px; }
.mu { color: var(--mu); } .sm { font-size: 13px; } .xs { font-size: 12px; }
.pos { color: var(--ok); } .neg { color: var(--bad); } .acc { color: var(--ac); }
.row { display: flex; align-items: center; gap: 10px; } .row.wrap { flex-wrap: wrap; }
.sp { flex: 1; } .col { display: flex; flex-direction: column; gap: 10px; }
.hidden { display: none !important; }

/* ---------- Barra superior ---------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(13,15,19,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 10px 14px calc(10px) ; display: flex; align-items: center; gap: 10px; }
.logo { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #111; flex: none; letter-spacing: .02em; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.top .nm { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .dt { font-size: 12px; color: var(--mu); }
.top .cash { text-align: right; margin-left: auto; }
.top .cash b { font-size: 16px; display: block; white-space: nowrap; }
.iconbtn { background: var(--s2); border: 1px solid var(--line); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.side { display: none; }
main { flex: 1; min-width: 0; padding: 14px 14px calc(var(--nav) + var(--adv) + 28px); max-width: 980px; margin: 0 auto; width: 100%; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
.sec-h h2 { font-size: 20px; }

/* ---------- Cartões ---------- */
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.card.tap { cursor: pointer; transition: border-color .15s, background .15s; }
.card.tap:active { background: var(--s2); }
.card h3 { margin-bottom: 8px; }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.kpi > span { font-size: 12px; color: var(--mu); display: block; margin-bottom: 2px; }
.kpi b { font-size: 18px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi small { font-size: 12px; color: var(--mu); }
.stat { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.stat:last-child { border-bottom: 0; }
.stat > span:first-child { color: var(--mu); }
.stat b { font-weight: 600; text-align: right; }
.stat b > span, table.t td.n { white-space: nowrap; }
.list-i { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list-i:last-child { border-bottom: 0; }
.list-i .t { font-weight: 600; } .list-i .d { font-size: 12.5px; color: var(--mu); }

/* ---------- Pílulas, barras ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--s3); color: var(--mu); white-space: nowrap; }
.pill.ok { background: var(--okbg); color: var(--ok); } .pill.bad { background: var(--badbg); color: var(--bad); }
.pill.warn { background: var(--acbg); color: var(--ac); } .pill.info { background: var(--infobg); color: var(--info); }
.bar { height: 7px; background: var(--s3); border-radius: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 9px; background: var(--ac); }
.bar.ok i { background: var(--ok); } .bar.bad i { background: var(--bad); } .bar.info i { background: var(--info); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- Botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--s2); color: var(--tx); border-radius: 11px; padding: 10px 14px; font-weight: 600; cursor: pointer; font-size: 14px; min-height: 42px; }
.btn:active { transform: translateY(1px); }
.btn.pri { background: var(--ac); border-color: var(--ac); color: #1a1205; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #04150a; }
.btn.danger { background: transparent; border-color: rgba(239,68,68,.5); color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: 13px; border-radius: 9px; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 auto; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--s1); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--mu); cursor: pointer; }
.chip.on { background: var(--acbg); color: var(--ac); border-color: rgba(245,165,36,.45); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.stepper button { background: var(--s2); border: 0; width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
.stepper b { min-width: 54px; text-align: center; }
input[type=text], input[type=number], select { width: 100%; background: var(--s2); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; outline: none; }
input:focus, select:focus { border-color: var(--ac); }
label.f { display: block; font-size: 12.5px; color: var(--mu); margin: 10px 0 5px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sw { width: 46px; height: 27px; border-radius: 99px; background: var(--s3); position: relative; flex: none; cursor: pointer; border: 0; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #c8ccd6; transition: .18s; }
.sw.on { background: var(--ac); } .sw.on::after { left: 22px; background: #1a1205; }

/* ---------- Avanço de tempo e navegação ---------- */
.adv { position: fixed; left: 0; right: 0; bottom: var(--nav); z-index: 25; padding: 8px 12px; display: flex; gap: 8px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.adv .btn { flex: 1; min-height: 44px; box-shadow: var(--sh); }
.adv .cal { flex: 1.6; background: var(--s1); border: 1px solid var(--line); border-radius: 11px; padding: 4px 10px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.adv .cal b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv .cal .hm { font-size: 15px; color: var(--ac); font-variant-numeric: tabular-nums; }
.adv .speeds { display: flex; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; box-shadow: var(--sh); }
.adv .speeds button { width: 42px; height: 40px; border: 0; border-radius: 9px; background: none; color: var(--mu); display: grid; place-items: center; cursor: pointer; }
.adv .speeds button.on { background: var(--ac); color: #1a1205; }
.adv .speeds svg.ic { fill: currentColor; stroke: none; }
.adv .speeds button:first-child svg.ic { fill: none; stroke: currentColor; stroke-width: 3; } .adv .cal span { font-size: 11px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; height: var(--nav); background: rgba(21,24,30,.97); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
.nav button { flex: 1; background: none; border: 0; color: var(--mu); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer; position: relative; }
.nav button svg { width: 22px; height: 22px; }
.nav button.on { color: var(--ac); }
.badge { position: absolute; top: 6px; right: calc(50% - 20px); background: var(--bad); color: #fff; font-size: 10px; border-radius: 99px; padding: 1px 5px; font-weight: 700; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Folha (bottom sheet) e toast ---------- */
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.ov.still, .ov.still .sheet { animation: none; }
.sheet { background: var(--s1); border: 1px solid var(--line); border-bottom: 0; width: 100%; max-width: 640px; max-height: 92vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { font-size: 17px; flex: 1; }
.sheet-b { padding: 14px 16px 22px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-f { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.sheet-f .btn { flex: 1; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav) + var(--adv) + 18px); z-index: 80; background: var(--s3); border: 1px solid var(--line); border-radius: 12px; padding: 11px 15px; max-width: 92vw; box-shadow: var(--sh); font-size: 14px; animation: up .2s; }
.toast.bad { border-color: rgba(239,68,68,.6); } .toast.ok { border-color: rgba(34,197,94,.55); }
.busy { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(0,0,0,.35); }
.spin { width: 42px; height: 42px; border: 4px solid var(--s3); border-top-color: var(--ac); border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- Específicos ---------- */
.alert { display: block; padding: 10px 12px; border-radius: 11px; font-size: 13.5px; margin-bottom: 8px; background: var(--s2); border-left: 3px solid var(--info); }
.alert.warn { border-left-color: var(--warn); } .alert.bad { border-left-color: var(--bad); background: var(--badbg); } .alert.good { border-left-color: var(--ok); }
.ev { border: 1px solid rgba(245,165,36,.45); background: linear-gradient(135deg, rgba(245,165,36,.10), transparent); }
.choice { width: 100%; text-align: left; display: block; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2); margin-bottom: 8px; cursor: pointer; }
.choice b { display: block; margin-bottom: 3px; } .choice span { font-size: 13px; color: var(--mu); }
.choice:active { border-color: var(--ac); }
.bus-ic { width: 44px; height: 44px; border-radius: 11px; background: var(--s2); display: grid; place-items: center; flex: none; font-size: 11px; font-weight: 800; color: var(--mu); border: 1px solid var(--line); }
.route { font-weight: 650; } .route .ar { color: var(--mu); margin: 0 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t td, table.t th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.t th { color: var(--mu); font-weight: 600; font-size: 12px; }
table.t td.n, table.t th.n { text-align: right; }
table.t tr.tot td { font-weight: 700; border-top: 1px solid var(--mu2); }
table.t tr.sub td { color: var(--mu); }
canvas.ch { width: 100%; height: 170px; display: block; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--mu); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.map { width: 100%; height: auto; display: block; background: var(--s2); border-radius: 12px; }
.map text { font-size: 9.5px; fill: var(--mu); }
.mapwrap { position: relative; touch-action: none; overscroll-behavior: contain; }
.mchips { margin-bottom: 6px; }
.mchips .chip { padding: 5px 10px; font-size: 12px; }
.pbmap text.uf { stroke: none; }
.pbmap { height: min(62vh, 560px); width: 100%; user-select: none; -webkit-user-select: none; cursor: grab; }
.pbmap text { pointer-events: none; paint-order: stroke; stroke: rgba(13,15,19,.85); stroke-width: 3px; stroke-linejoin: round; }
.mapbtns { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.mapbtns button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: rgba(21,24,30,.92); color: var(--tx); font-size: 17px; font-weight: 700; display: grid; place-items: center; cursor: pointer; }
.empty { text-align: center; padding: 26px 10px; color: var(--mu); }
.tabs { display: flex; background: var(--s2); border-radius: 12px; padding: 4px; margin-bottom: 12px; gap: 4px; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 9px 4px; font-weight: 600; font-size: 13px; color: var(--mu); cursor: pointer; }
.tabs button.on { background: var(--s3); color: var(--tx); }
.more-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.more-grid button { background: var(--s2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; cursor: pointer; }
.more-grid svg { width: 26px; height: 26px; color: var(--ac); }

/* ---------- Tela inicial ---------- */
.start { max-width: 560px; margin: 0 auto; padding: 26px 16px 40px; }
.hero { text-align: center; padding: 18px 0 22px; }
.hero .logo { width: 64px; height: 64px; font-size: 20px; margin: 0 auto 12px; border-radius: 18px; }
.hero h1 { font-size: 28px; }
.scn { border: 1.5px solid var(--line); border-radius: 14px; padding: 13px; margin-bottom: 10px; cursor: pointer; background: var(--s1); }
.scn.on { border-color: var(--ac); background: var(--acbg); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
.swatch.on { border-color: #fff; }

/* ---------- Telas maiores ---------- */
@media (min-width: 560px) {
  .kpis { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 920px) {
  .side { display: flex; flex-direction: column; gap: 2px; width: 230px; flex: none; position: sticky; top: 0; height: 100vh; padding: 14px 10px; border-right: 1px solid var(--line); background: var(--s1); }
  .side button { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--mu); padding: 10px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; text-align: left; position: relative; }
  .side button.on { background: var(--acbg); color: var(--ac); }
  .side .badge { position: static; margin-left: auto; }
  .nav { display: none; }
  .adv { left: 230px; bottom: 0; max-width: 980px; margin: 0 auto; right: 0; }
  main { padding-bottom: calc(var(--adv) + 30px); }
  .toast { bottom: 80px; }
  .ov { align-items: center; }
  .sheet { border-radius: 18px; border-bottom: 1px solid var(--line); max-height: 86vh; }
  .grid-d2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-d2 > .card { margin-bottom: 0; }
}

/* ---------- Painel de comando (Início/Financeiro) ---------- */
.hcard { padding: 16px; background: linear-gradient(160deg, var(--s2), var(--s1) 60%); }
.hcard.bad { border-color: var(--bad); } .hcard.warn { border-color: rgba(245,158,11,.55); }
.hcard .big { font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini3, .mini4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini4 { grid-template-columns: repeat(4, 1fr); }
.mini3 > div, .mini4 > div { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r2); padding: 8px 9px; min-width: 0; }
.mini3 span, .mini4 span { display: block; font-size: 11px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini3 b, .mini4 b { display: block; font-size: 14.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.25; }
.hero-bill { margin-top: 12px; padding: 10px 12px; border-radius: var(--r2); background: var(--bg); border-left: 3px solid var(--ok); }
.hero-bill.bad { border-left-color: var(--bad); }
.hero-why { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; cursor: pointer; }
.okline { margin: 0 0 12px; padding: 10px 14px; border-radius: var(--r); background: var(--okbg); color: var(--ok); font-size: 13.5px; font-weight: 600; }
.card.slim { padding: 11px 14px; }
.fold { padding: 0; }
.fold-h { display: flex; align-items: center; gap: 8px; padding: 13px 14px; cursor: pointer; }
.fold-h h3 { margin: 0; }
.fold-b { padding: 0 14px 14px; }
.chev { color: var(--mu); font-size: 20px; line-height: 1; transition: transform .15s; display: inline-block; }
.chev.on { transform: rotate(90deg); }
.hbar { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
.hbar > span { width: 46%; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar > b { width: 78px; text-align: right; font-variant-numeric: tabular-nums; }
.cmp { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 6px 10px; align-items: center; }
.cmp b { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.cmp > .xs { text-align: right; }
.tabs.sub { margin-top: -4px; }
/* ---------- Frota / Linhas compactas ---------- */
.blist { padding: 4px 14px; }
.bl-h { display: flex; align-items: center; gap: 8px; padding: 10px 0 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
.brow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.brow:last-child { border-bottom: 0; }
.brow .bus-ic { width: 38px; height: 38px; font-size: 12px; flex: none; }
.brow .t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brow .t .pill { font-size: 10.5px; padding: 1px 6px; }
.brow .d { font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brow .cond { font-size: 13px; width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
.tx { color: var(--tx); }

/** Informações de calendário de um dia: fatores de demanda geral e turística. */
function calInfo(day) {
  const t = dateOf(day);
  let f = MONTH_F[t.m] * DOW_F[t.dow], tour = 0, name = null;
  if (t.m === 0 || t.m === 6) { tour += 0.35; name = 'Férias escolares'; }
  if (t.m === 11 && t.d >= 15) { tour += 0.2; name = 'Férias escolares'; }
  for (const h of holidays(t.y)) if (day >= h.from && day <= h.to) { f *= h.f; tour += h.tour; name = h.name; break; }
  return { ...t, f, tour, name };
}

/** Próximos períodos especiais (para o calendário da interface). */
function upcoming(day, n = 6) {
  const t = dateOf(day), out = [];
  [t.y, t.y + 1].forEach(y => holidays(y).forEach(h => { if (h.to >= day && h.f > 1) out.push(h); }));
  [t.y, t.y + 1].forEach(y => { [0, 6].forEach(m => { const from = dayOf(y, m, 1); if (from + 30 >= day) out.push({ from, to: from + 30, name: 'Férias escolares de ' + MONTHS[m], f: 1.2 }); }); });
  return out.sort((a, b) => a.from - b.from).slice(0, n);
}

/** Tarifa de referência do mercado (convencional) para uma distância. */
function baseFare(S, dist) { return (15 + 0.34 * Math.pow(dist, 0.93)) * S.eco.ipca; }
function marketSalary(S, role) { return ROLES[role].base * S.eco.wageIdx; }

/** Modificadores temporários (eventos). */
function modVal(S, type, def = 1, filter) {
  let v = def;
  for (const m of S.mods) if (m.type === type && m.until >= S.day && (!filter || filter(m))) v *= m.v;
  return v;
}
function dieselFor(S, co) {
  if (co.fuelLock && co.fuelLock.until >= S.day) return co.fuelLock.price;
  return S.eco.diesel;
}

/* 4. CRIAÇÃO DE EMPRESAS, ÔNIBUS E FUNCIONÁRIOS                       */
/* ------------------------------------------------------------------ */
function curYear(S) { return dateOf(S.day).y; }
/** Idade do ônibus em anos, contada dia a dia desde a fabricação (b.made). Ônibus antigos (sem b.made): conta a partir
 *  do fim do ano-modelo, então um ônibus comprado em dezembro não "envelhece um ano" na virada. */
function madeDay(b) { return b.made !== undefined ? b.made : dayOf(b.year, 11, 31); }
function busAge(S, b) { return Math.max(0, (S.day - madeDay(b)) / 365); }
const NEW_PRICE = 1.2; // ônibus 0 km ~20% mais caros (chassi + carroceria no Brasil passam de R$ 1 mi)
function modelPrice(S, mid) { return MODELS[mid].price * NEW_PRICE * S.eco.busIdx; }

/** Valor de mercado de um ônibus (base de revenda e patrimônio). */
function busValue(S, b) {
  const m = MODELS[b.model], age = busAge(S, b);
  // Perde ~25% no 1º ano (saiu da concessionária) e depois ~9% ao ano
  const v = modelPrice(S, b.model) * (age < 1 ? 1 : 0.75 * Math.pow(0.91, age - 1)) * (0.6 + 0.4 * b.cond / 100) * Math.max(0.7, 1 - b.km / 3.5e6);
  return Math.max(modelPrice(S, b.model) * 0.12, v);
}
function maxCond(S, b) { return clamp(100 - busAge(S, b) * 2.4 + (b.renov || 0), 30, 100); }

/** Custo/receita por ônibus no mês (só informativo; não mexe no razão contábil). */
const BC_KEYS = ['diesel', 'pedagio', 'manut', 'oficina', 'limpeza', 'bordo', 'ocorr', 'imp', 'motor', 'seguro', 'parcela'];
function bc(b, k, v) {
  if (!b || b.co !== 'P' || !v) return;
  const m = b.mc || (b.mc = { cur: {}, last: null });
  m.cur[k] = (m.cur[k] || 0) + v;
}
function bcCost(o) { return o ? sum(BC_KEYS, k => o[k] || 0) : 0; }
function rotateBusCosts(S, co) {
  const ip = S.eco.ipca;
  for (const b of S.buses) {
    if (b.co !== co.id) continue;
    if (b.status === 'entrega') continue; // ainda não chegou: sem custos
    bc(b, 'seguro', 0.0024 * busValue(S, b) + 1100 * ip);
    const m = b.mc || (b.mc = { cur: {}, last: null });
    m.cur.d1 = S.day; if (m.cur.d0 === undefined) m.cur.d0 = Math.max(b.bought || 0, S.day - dateOf(S.day - 1).d);
    m.last = m.cur; m.cur = { d0: S.day };

}
function makeBus(S, coId, model, year, km, cond) {
  const co = S.cos.find(c => c.id === coId);
  const b = { id: nid(S, 'b'), co: coId, model, year, km: Math.round(km), cond, clean: 90, renov: 0,
    status: 'ativo', line: null, t: 0, loc: 0, kmSince: Math.round(rr(S, 0, 12000)), breakdowns: 0,
    prefix: co ? (co.nextPrefix = (co.nextPrefix || 1000) + 1) : 1000, bought: S.day, made: year >= curYear(S) ? S.day : dayOf(year, ri(S, 0, 11), 15) };
  S.buses.push(b); if (S.busMap) S.busMap[b.id] = b;

}
/** Remove um ônibus da empresa (venda/liquidação), mantendo a base de depreciação coerente. */
function removeBus(S, b) {
  const co = S.cos.find(c => c.id === b.co);
  if (b.subFor) { const o = S.buses.find(x => x.id === b.subFor); if (o) o.subBy = null; b.subFor = null; }
  unassign(S, b);

/** Ônibus usado plausível (para mercado e cenários). */
function randomUsed(S, coId, cats, ageMin = 3, ageMax = 16) {
  const y = curYear(S);
  const opts = Object.keys(MODELS).filter(k => cats.includes(MODELS[k].cat));
  const model = pick(S, opts);
  let age = ri(S, ageMin, ageMax);
  age = Math.min(age, y - MODELS[model].intro);
  const km = age * rr(S, 85000, 140000);
  const cond = clamp(100 - age * rr(S, 2.6, 4.2) - rr(S, 0, 8), 28, 96);
  return { model, year: y - Math.max(0, age), km, cond };
}

function makeEmp(S, role, skill) {
  skill = Math.round(clamp(skill === undefined ? 35 + gauss(S) * 14 + 15 : skill, 15, 95));
  const exp = Math.max(0, Math.round((skill - 20) / 6 + gauss(S) * 2));
  const ask = Math.round(marketSalary(S, role) * (0.82 + 0.45 * skill / 100) / 10) * 10;
  return { id: nid(S, 'e'), role, name: pick(S, FIRST) + ' ' + pick(S, LAST), skill, exp, salary: ask, sat: Math.round(rr(S, 58, 75)), hired: S.day, trained: -999 };
}

function makeCompany(S, o) {

function makeLine(S, coId, rid, price, freq, cat) {

/** Conforto típico por categoria (linha ainda sem ônibus). */
const CATS_COMFORT = { conv: 38, exec: 57, semi: 70, leito: 80, dd: 79 };
/** Recalcula categoria predominante, lugares e conforto médios a partir dos ônibus da linha. */
function lineProfile(S, L) {
  const bs = L.buses.map(id => S.buses.find(y => y.id === id)).filter(Boolean);
  if (!bs.length) return;
  const cats = {}; bs.forEach(x => { const c = MODELS[x.model].cat; cats[c] = (cats[c] || 0) + 1; });
  const order = ['conv', 'exec', 'semi', 'leito', 'dd'];
  L.cat = Object.entries(cats).sort((a, c) => c[1] - a[1] || order.indexOf(c[0]) - order.indexOf(a[0]))[0][0];
  if (L.conc) L.price = concFare(S, L); // tarifa do contrato (+ diferença se roda categoria superior)
  L.capC = sum(bs, x => MODELS[x.model].cap) / bs.length; L.comfortC = sum(bs, x => busComfort(x)) / bs.length;
}
function blankLineMon() { return { pax: 0, seats: 0, trips: 0, rev: 0, cost: 0, cancel: 0, late: 0, lost: 0, lostC: 0, cr: {} }; }
/** Motivos de cancelamento (por linha): motorista, onibus (sem ônibus disponível), oficina (quebrou/foi para a oficina),
 *  atraso (ônibus não chegou a tempo), realocado (ônibus saiu da linha). Guarda também quando aconteceu pela última vez. */
const CANCEL_WHY = { motorista: 'Falta de motorista', onibus: 'Sem ônibus disponível (oficina, sem reserva)', oficina: 'Ônibus quebrou ou foi para a oficina', atraso: 'Ônibus não chegou a tempo para a partida', realocado: 'Ônibus saiu da linha', escala: 'Escala maior do que os ônibus da linha conseguem fazer' };

/** Novo jogo. */
function newGame(opts) {
  const S = { v: 1, seed: opts.seed || (Date.now() & 0x7fffffff), rng: 0, seq: 0, day: 0, cos: [], buses: [], lines: [], emps: [], cands: [],
    used: [], events: [], pending: [], mods: [], hiring: [], news: [], notes: [], goals: null, spd: 1, trips: [], reports: [], weekly: [], daily: [], over: false, t: 0, plan: null, onRoad: [], speed: 120,
    eco: { diesel: DIESEL_BASE, ipca: 1, wageIdx: 1, busIdx: 1, selic: 11.25, demand: 1.0, infl: 0.0035, growth: 1 }, lastEventDay: 0, ui: {} };
  S.eco.squeeze = 0.10 + (S.seed * 7919 % 100) / 100 * 0.05; // queda de 10–15% da procura a partir do 2º ano
  S.rng = S.seed;
  const sc = SCENARIOS[opts.scenario || 'A'];
  const P = makeCompany(S, { id: 'P', name: opts.name || 'Minha Viação', short: opts.short, color: opts.color || '#f59e0b', player: true,
    cash: sc.cash, rep: sc.rep, states: sc.states, bays: sc.bays });
  P.scenario = opts.scenario || 'A';
  const y = curYear(S);
  const pb = sc.buses.map(([m, age, cond]) => makeBus(S, 'P', m, y - age, age * rr(S, 95000, 125000), cond));
  sc.lines.forEach(([rid, pm, freq, idx]) => {
    const r = ROUTES[rid];
    const cat = MODELS[pb[idx[0]].model].cat;
    const L = makeLine(S, 'P', rid, baseFare(S, r.dist) * pm, freq, cat); L.opened = -365;
    idx.forEach(i => assignBusRaw(S, pb[i], L));
    L.freq = Math.max(1, Math.min(freq, Math.floor(planCapacity(S, L, L.buses) / 2)));
    const ci = S.lines.filter(l => l.co === 'P').length - 1, end = Math.min(CONC_DAYS - 40, 300 + ci * 210 + ri(S, 0, 40)), op = L.opened;
    setConcession(S, L, { start: end - CONC_DAYS, minF: Math.max(1, L.freq - 1), minCat: L.cat === 'dd' ? 'semi' : L.cat, nightMin: 0, ceil: L.price, disc: 0 }); L.opened = op;
  });
  Object.entries(sc.staff).forEach(([role, n]) => { for (let i = 0; i < n; i++) S.emps.push(makeEmp(S, role, 38 + rnd(S) * 30)); });
  if (sc.debt) {
    const dm = opts.scenario === 'C' ? 48 : 30;
    const dl = addLoan(S, P, 'capital', sc.debt, 0.0145, dm, 'Dívida inicial da empresa');
    // mesma taxa de um capital de giro hoje (a empresa já tem essa dívida no banco)
    dl.rate = loanRate(S, P, 'capital'); dl.pay = Math.round(sc.debt * dl.rate / (1 - Math.pow(1 + dl.rate, -dm)));
    P.cash -= sc.debt; // a dívida já existia: o caixa inicial é líquido
  }
  P.cash = sc.cash;
  // Concorrentes
  AI_START.forEach(a => spawnAI(S, a, true));
  refreshUsed(S, 14); refreshCands(S);
  S.cos.forEach(c => { c.lastValue = fleetValue(S, c); c.tier = calcTier(S, c); c.led = {}; });
  news(S, `Fundação da carreira: ${P.name} começa a operar.`, 'P');
  initGoals(S); S.notes = []; S.comp26 = true; S.trans26 = true;

  return S;
}

/** Cria uma empresa da IA com frota e linhas iniciais coerentes com sua estratégia. */
/** Qualidade de gestão (oculta) de uma empresa da IA: 0,8 (ruim) a 1,15 (ótima).
 *  Gestão ruim custa mais (administração e manutenção) e avalia mal novas linhas (otimismo). */
const MGMT_MEAN = { economica: 0.97, agressiva: 0.94, premium: 1.05, regional: 1.0, expansionista: 0.95 };
function rollMgmt(S, persona) { return clamp((MGMT_MEAN[persona] || 1) + gauss(S) * 0.09, 0.75, 1.15); }
function mgmtOf(co) { return co && !co.player && co.mgmt ? co.mgmt : 1; }
function spawnAI(S, a, initial) {
  const pers = PERSONAS[a.persona];
  const co = makeCompany(S, { name: a.name, short: a.short, color: a.color, persona: a.persona, cash: a.cash, rep: a.rep, states: a.states, bays: Math.max(2, Math.round(a.fleet / 6)) });
  co.mgmt = a.mgmt || rollMgmt(S, a.persona);
  co.home = a.states.slice();
  co.policy = { prevKm: pers.prevKm, autoClean: a.persona !== 'economica' && co.mgmt >= 0.9, external: true, reviseCond: pers.reviseCond - (co.mgmt < 0.9 ? 12 : 0) };
  const y = curYear(S);
  // Rotas candidatas dentro dos estados da empresa, ordenadas por demanda
  let cands = ROUTE_LIST.filter(r => co.states.includes(CITY[r.a].uf) && co.states.includes(CITY[r.b].uf) && r.dist >= 80 && r.dist <= 1300)
    .sort((x, z) => z.base - x.base);
  // Leve aleatoriedade para variar as campanhas
  cands = cands.slice(0, 28).sort(() => rnd(S) - 0.5);
  let fleetLeft = a.fleet;
  for (const r of cands) {
    if (fleetLeft < 2) break;
    if (S.lines.some(l => l.co === co.id && l.route === r.id)) continue;
    if (initial && S.lines.some(l => l.co === 'P' && l.route === r.id) && (S.cos[0].scenario === 'A' || S.lines.filter(l => l.route === r.id).length >= 2)) continue;
    const cat = pick(S, pers.cats);
    const hours = r.dist / 66 + 0.3;
    const perBus = hours <= 7 ? Math.max(1, Math.floor(14 / hours)) : (hours <= 14 ? 1 : 24 / (hours + turnaround(hours)));
    const mm = MODELS[aiChooseModel(S, co, cat)];
    const price = baseFare(S, r.dist) * CATS[cat].ref * pers.priceMult;
    // Frequência dimensionada pela demanda estimada (ocupação-alvo ~70%)
    let freq = 1;
    while (freq < 8 && estimateLine(S, co.id, r.id, price, mm.comfort, mm.cap, freq + 1).occ > 0.58) freq++;
    if (estimateLine(S, co.id, r.id, price, mm.comfort, mm.cap, freq).occ < 0.4) continue;
    let nb = Math.ceil(freq * 2 / perBus);
    if (nb > fleetLeft) continue;

/** Partidas programadas abaixo do mínimo do contrato: multa diária; 30 dias seguidos = caducidade. */

    if (c.maxAvg) { const avg = lineAvgAge(S, L); if (avg > c.maxAvg) issueOn(S, L, 'idadeMedia', `Idade média da frota ${round(avg, 1)} anos; o contrato exige até ${c.maxAvg}: ${c.avgOver && S.day < c.avgOver + 90 ? `prazo de adequação até ${fmtDate(c.avgOver + 90)}, depois multa todo mês` : 'multa todo mês'}`); }
  }

/* ---- Linhas obrigatórias (pedido do governo) ---- */
/** Confere as linhas com obrigação: frequência mínima cumprida = recebe o subsídio; senão, multa. */
function obligationsMonth(S, co) {

    else { const f = 25000 * S.eco.ipca; book(S, co, 'ocorrencias', f); co.rep = Math.max(1, co.rep - 2); if (co.player) news(S, `Multa de ${fmtMoney(f)}: a linha obrigatória ${lineRef(L)} não cumpriu a frequência mínima (${o.minF}× por sentido) e ficou sem subsídio.`, 'P', 'bad'); }

/** Escolhe uma rota fraca para o governo pedir (pouca demanda, estado onde a empresa opera). */
function obligationRoute(S, co) {
  const c = ROUTE_LIST.filter(r => co.states.includes(CITY[r.a].uf) && co.states.includes(CITY[r.b].uf) && r.dist < 520 && !S.lines.some(l => l.co === co.id && l.route === r.id));

  const e = estimateLine(S, co.id, r.id, price, m.comfort, m.cap, 1);

}
/** Aceita a linha obrigatória: abre a linha (começa em 10–15 dias) com o compromisso. */
function acceptObligation(S, co, o) {

/** Limite de capital de giro disponível. */
/** Limite de capital de giro: o MENOR entre (1) capacidade de pagamento — metade da sobra mensal (lucro operacional

 *  dívida (valor dos ônibus menos o que ainda se deve deles) + 50% da receita líquida do mês. Nota: A 100%, B 80%, C 50%, D 0. */

  const rec = S.eco.cycle && S.eco.cycle.phase === 'recessao' ? 0.6 : 1;
  const lim = Math.max(0, Math.round(Math.min(capAmt, coll) * gf * rec / 1000) * 1000);
  return { lim, grade, gf, avgOp, pays, free, room, capAmt: isFinite(capAmt) ? capAmt : null, fv, busDebt, freeFleet, coll, cg, rec, by: capAmt < coll ? 'pagamento' : 'garantia' };
}
function creditLimit(S, co) { return creditBreakdown(S, co).lim; }
function overdraftLimit(S, co) { return Math.round((60000 + 25000 * S.buses.filter(b => b.co === co.id).length) * (1 - creditRisk(S, co) * 0.5)); }

/* 6. FUNCIONÁRIOS                                                     */
/* ------------------------------------------------------------------ */
/** Resumo de equipe e capacidades. Jogador: indivíduos. IA: contagens agregadas. */
function staffInfo(S, co) {
  const out = { n: {}, skill: {}, sat: {}, payroll: 0, driverHours: 0 };
  Object.keys(ROLES).forEach(r => { out.n[r] = 0; out.skill[r] = 0; out.sat[r] = 0; });
  if (co.player) {
    for (const e of S.emps) {
      out.n[e.role]++; out.skill[e.role] += e.skill; out.sat[e.role] += e.sat; out.payroll += e.salary * ENCARGOS;
      if (e.role === 'motorista') out.driverHours += 6.2 * (0.8 + 0.2 * e.sat / 100) * (0.95 + 0.1 * e.skill / 100);
    }
    Object.keys(ROLES).forEach(r => { if (out.n[r]) { out.skill[r] /= out.n[r]; out.sat[r] /= out.n[r]; } });
    out.driverHours *= modVal(S, 'strike', 1);
  } else {
    const a = co.aiStaff || {};
    const p = PERSONAS[co.persona];
    Object.keys(ROLES).forEach(r => { out.n[r] = a[r] || 0; out.skill[r] = p.skill; out.sat[r] = 62; out.payroll += out.n[r] * marketSalary(S, r) * p.wage * ENCARGOS; });
    out.driverHours = out.n.motorista * 6.2 * 0.92;
  }

  const lines = S.lines.filter(l => l.co === co.id).length;
  out.fleet = fleet; out.lines = lines;
  out.adminCap = 3 + out.n.administrativo * 6 + out.n.gerente * 12;
  out.adminNeed = fleet + lines * 0.5;
  out.adminRatio = out.adminNeed ? clamp(out.adminCap / out.adminNeed, 0, 1.5) : 1.5;
  const cities = new Set(); S.lines.filter(l => l.co === co.id).forEach(l => stopsOf(ROUTES[l.route]).forEach(c => cities.add(c)));
  out.attNeed = cities.size + co.terminals.length * 2;
  out.attCov = out.attNeed ? clamp(out.n.atendente / out.attNeed, 0, 1.2) : 1;
  out.mechCov = fleet ? clamp(out.n.mecanico / (fleet / 6), 0, 1.3) : 1;

/** IA ajusta sua equipe (contratação agregada) à operação atual. */
function aiStaff(S, co) {
  const buses = S.buses.filter(b => b.co === co.id);
  const lines = S.lines.filter(l => l.co === co.id);
  let hours = 0;
  for (const L of lines) { const r = ROUTES[L.route], h = tripHoursBase(r); hours += L.freq * 2 * crewHours(S, co, r, h, false) + (L.freqN || 0) * 2 * crewHours(S, co, r, h, true); } // mesma conta de tripulação do jogador (dupla em viagem longa, noturna)
  const cities = new Set(); lines.forEach(l => stopsOf(ROUTES[l.route]).forEach(c => cities.add(c)));
  co.aiStaff = { motorista: Math.ceil(hours * 1.15 / (6.2 * 0.92)) + 1 + (co._drvShort || 0), mecanico: Math.max(1, Math.ceil(buses.length / 6)),
    atendente: cities.size + co.terminals.length * 2, administrativo: Math.max(1, Math.ceil((buses.length + lines.length * 0.5 - 3) / 6)),
    gerente: Math.floor(buses.length / 14) };
}

function refreshCands(S) {
  S.cands = [];
  // motoristas: o mercado de trabalho acompanha o porte da empresa (e reputação boa atrai mais gente)
  const P = S.cos && S.cos[0], fleet = P ? S.buses.filter(b => b.co === P.id && b.status !== 'entrega').length : 0;
  const nDrv = 8 + Math.floor(fleet / 3) + (P && P.rep >= 70 ? 3 : 0);
  Object.keys(ROLES).forEach(role => { const n = role === 'motorista' ? nDrv : 4 + Math.floor(fleet / 15); for (let i = 0; i < n; i++) S.cands.push(makeEmp(S, role)); });
}

/** Atualização mensal de satisfação, experiência e pedidos de demissão. */
function monthlyStaff(S, co, info) {
  const quits = [];
  const util = info.driverHours ? clamp((co._driverUse || 0) / info.driverHours, 0, 1.3) : 0;
  const otDays = (co.month && co.month.otDays) || 0;
  for (const e of S.emps.slice()) {
    const ms = marketSalary(S, e.role);
    let target = 58 + (e.salary / ms - (0.82 + 0.45 * e.skill / 100)) * 160 + info.n.gerente * 2;
    if (e.role === 'motorista' && util > 0.92) target -= Math.min(10, (util - 0.92) * 60);
    if (e.role === 'motorista' && otDays) target -= otDays / 30 * 18; // hora extra frequente cansa
    if (S.day - e.trained < 120) target += 8;
    if (co.cash < 0) target -= 10;
    target = clamp(target, 5, 98);
    e.sat = Math.round(clamp(e.sat + (target - e.sat) * 0.35 + gauss(S) * 2, 0, 100));
    e.exp += 1 / 12;
    if (e.skill < 92) e.skill = Math.min(95, e.skill + 0.25 + (S.day - e.trained < 60 ? 0.5 : 0));
    if (rnd(S) < Math.max(0, 40 - e.sat) / 110) { quits.push(e); S.emps.splice(S.emps.indexOf(e), 1); }
  }
  if (quits.length) S.notes.push({ k: 'slow', t: 'motoristas', txt: `${quits.length} funcionário(s) pediram demissão.` });
  if (quits.length) news(S, `${quits.length} funcionário(s) pediram demissão (${quits.map(q => ROLES[q.role].label.toLowerCase()).join(', ')}). Satisfação baixa.`, 'P', 'warn');
  return quits;
}

/* 7. DEMANDA E PREÇO                                                  */

/** Dois segmentos de passageiros: econômico (sensível a preço) e conforto.
 *  Atratividade logit: frequência^0,7 × e^(−elast·preçoRel + peso·conforto + reputação).

/** Pontos de troca possíveis numa rota: [{c, f}] com f = fração do caminho (0..1) a partir de stops[0]. */

/** Custo de motorista de uma viagem noturna ÷ a mesma viagem de dia (adicional noturno × tripulação). */
function nightDriverMult(h, S, co, r) { return NIGHT.wage * crewHours(S, co, r, h, true) / crewHours(S, co, r, h, false); }
/** Horários das saídas noturnas (21h–23h). */

/** Divisão dia/noite efetiva: leito, semileito e double-deck em rotas de 5 h+ fazem pelo menos uma saída à noite

/** Escala noturna: depois das saídas do dia, cada sentido recebe n partidas entre 21h e 23h,

  const ns = nightShare(tripHoursBase(r));

/** Fator de demanda de uma rota num dia (sazonalidade, eventos, economia). */
/* ---- Ciclo do mercado na carreira ----
 * 1º ano aquecido (+10%) para o jogador aprender; do 13º ao 24º mês a procura esfria aos poucos
 * (carona por aplicativo, aérea de baixo custo, pedágios) até 10–15% abaixo do normal.

function calcTier(S, co) {

  const ufs = new Set(); S.lines.filter(l => l.co === co.id).forEach(l => { ufs.add(CITY[l.a].uf); ufs.add(CITY[l.b].uf); });
  const regs = new Set([...ufs].map(u => UF[u].reg));
  let t = 1;
  for (const T of TIERS) if (fleet >= T.buses && lines >= T.lines && ufs.size >= T.states && regs.size >= T.regions) t = T.n;
  return t;
}

function monthlyFixed(S, co, info) {
  const buses = S.buses.filter(b => b.co === co.id && b.status !== 'entrega'); // a caminho: seguro e administração só depois da entrega
  const lines = S.lines.filter(l => l.co === co.id);
  const ip = S.eco.ipca;
  book(S, co, 'salarios', info.payroll);
  book(S, co, 'seguros', sum(buses, b => 0.0024 * busValue(S, b) + 1100 * ip));
  const adminOver = info.adminRatio < 1 ? (1 - info.adminRatio) * info.adminNeed * 900 * ip : 0;
  book(S, co, 'administrativas', (4000 + 3200 * buses.length + 1300 * lines.length + 2500 * co.states.length) * ip * (1 + (1 - mgmtOf(co)) * 3) + adminOver);
  book(S, co, 'terminais', (6000 + co.garage.bays * 2600) * ip + sum(co.terminals, c => (7000 + CITY[c].pop * 1.4) * ip));
  if (co.bases && co.bases.length) book(S, co, 'terminais', sum(co.bases, c => baseMonthly(S, c)));
}
function payLoans(S, co) {
  for (const L of co.loans.slice()) {
    const interest = L.bal * L.rate;
    const amort = Math.min(L.bal, Math.max(0, L.pay - interest));
    book(S, co, 'juros', interest);
    book(S, co, 'amortizacao', amort);
    if (L.bus) bc(S.busMap && S.busMap[L.bus] || S.buses.find(x => x.id === L.bus), 'parcela', interest + amort);
    L.bal = Math.round(L.bal - amort); L.left--;
    if (L.bal <= 1 || L.left <= 0) { if (L.bal > 0) book(S, co, 'amortizacao', L.bal); co.loans.splice(co.loans.indexOf(L), 1); }
  }
}

/** Demanda reprimida: linha com ocupação ≥ 90% por 3 meses seguidos leva o governo a licitar mais uma operadora
 *  na ligação (no itinerário, no trecho de maior procura). */
function hotRoutesMonth(S) {
  S.hotRoutes = S.hotRoutes || [];
  for (const L of S.lines) {
    if (!L.buses.length || !L.mon || !L.mon.seats) continue;
    const occ = L.mon.pax / L.mon.seats;
    L.hot = occ >= 0.9 ? (L.hot || 0) + 1 : 0;
    if (L.hot < 3 || (L.hotCool && S.day < L.hotCool)) continue;
    const r = ROUTES[L.route];
    const rid = r.stops ? r.subs.slice().sort((a, b) => ROUTES[b.rid].base - ROUTES[a.rid].base)[0].rid : L.route;
    if (S.hotRoutes.some(h => h.rid === rid) || routeOperators(S, rid).length >= routeCap(ROUTES[rid]) + 1) { L.hot = 0; continue; }
    S.hotRoutes.push({ rid, from: L.id, day: S.day }); L.hot = 0; L.hotCool = S.day + 240;
    const t = `Demanda reprimida em ${placeName(ROUTES[rid])}: os ônibus vivem lotados e o governo vai abrir edital para mais uma empresa operar a ligação.`;
    news(S, t, L.co === 'P' ? 'P' : null, L.co === 'P' ? 'bad' : null);
    if (L.co === 'P') pushEvent(S, { kind: 'info', title: 'Concorrência a caminho', text: `${t} Sua linha ${lineRef(L)} pode perder passageiros nesse trecho. Para se defender: mais saídas (enquanto o edital não sai), ônibus de categoria melhor ou disputar o edital você mesmo.` });
  }
}
/** Em janeiro, 2 cidades crescem (indústria, universidade, aeroporto...): a procura das rotas delas sobe e surgem editais bons. */
function growthMonth(S) {
  if (dateOf(S.day).m !== 0 || S.day < 200) return;
  S.grow = S.grow || {};
  const why = ['nova fábrica', 'campus universitário novo', 'expansão do aeroporto', 'polo logístico', 'boom imobiliário'];
  for (let i = 0; i < 2; i++) {
    const c = pick(S, CITIES.filter(x => x.pop > 150)), v = rr(S, 1.08, 1.15);
    S.grow[c.id] = round((S.grow[c.id] || 1) * v, 3);
    news(S, `${c.name} cresce (${pick(S, why)}): procura nas rotas da cidade +${Math.round((v - 1) * 100)}%. Fique de olho nos editais.`, null);
  }
}
/** Fecha o mês: folha, custos fixos, dívidas, depreciação, IA, relatórios. */
function closeMonth(S) {
  const prevDay = S.day - 1, pt = dateOf(prevDay);
  hotRoutesMonth(S); growthMonth(S);

    obligationsMonth(S, co);
    concessionMonth(S, co);
    capitalAgeCheck(S, co);
    vistoriaMonth(S, co);

    if (co.player) { ageAvgWarn(S, co); regMonth(S, co); }
    if (co.player) rotateBusCosts(S, co);
    // Depreciação = perda de valor da frota no mês (não sai do caixa)
    const val = fleetValue(S, co);
    book(S, co, 'depreciacao', Math.max(0, co.lastValue - val));
    co.lastValue = val;
    if (co.player) monthlyStaff(S, co, info);
    // Cheque especial automático se o caixa ficar negativo
    if (co.cash < 0) {
      const od = co.loans.find(l => l.kind === 'cheque');
      const lim = overdraftLimit(S, co);
      const need = -co.cash + 20000;
      const cur = od ? od.bal : 0;
      if (cur + need <= lim) {
        if (od) { od.bal += need; od.pay = Math.round(od.bal * 0.12); od.left = 12; book(S, co, 'emprestimos', need); }
        else addLoan(S, co, 'cheque', need, 0.068, 12, 'Cheque especial (automático)');
        co.negMonths = 0;
        if (co.player) news(S, `Caixa negativo coberto pelo cheque especial (R$ ${Math.round(need).toLocaleString('pt-BR')}). Juros de 6,8% ao mês.`, 'P', 'bad');
      } else {
        // Parcelas em atraso: multa de 2% + mora, nota cai por 6 meses
        const late = sum(co.loans, l => l.pay) * 0.03; book(S, co, 'juros', late); co._lateNow = true;
        co.bankMod = { pts: -2, until: S.day + 180 };
        if (co.player) news(S, `Parcelas em atraso: multa e mora de ${fmtMoney(late)} e sua nota no banco caiu por 6 meses.`, 'P', 'bad');
        // Sem crédito: o banco exige a venda de ônibus (parados primeiro, depois os mais velhos)
        const sold = [];
        const order = S.buses.filter(b => b.co === co.id && b.status !== 'fretamento' && b.status !== 'entrega' && !(S.onRoad || []).some(x => x.bus === b.id))
          .sort((x, y) => (!!x.line - !!y.line) || (busAge(S, y) - busAge(S, x)));
        // IA: o banco só força a venda dos ônibus parados; se ainda faltar, a empresa quebra com frota e linhas (vai a leilão)
        if (!co.player) { for (const b of order.filter(x => !x.line)) { if (co.cash >= 0) break; book(S, co, 'vendaAtivos', busValue(S, b) * 0.82); removeBus(S, b); }
          if (co.cash < 0 && co.negMonths >= 1) { bankrupt(S, co); continue; } } // 2º mês seguido: quebra com a frota
        for (const b of order) { if (co.cash >= 0) break; const v = busValue(S, b) * 0.82; const L = b.line ? S.lines.find(l => l.id === b.line) : null; removeBus(S, b); book(S, co, 'vendaAtivos', v); sold.push(b.prefix); if (L) replanLine(S, L); if (busAge(S, b) < 18) S.used.push(usedListing(S, b)); }
        if (co.cash < 0 || (!co.player && sold.length)) {
          // IA: mês em que o banco precisou forçar venda de ônibus conta como mês sem caixa e sem crédito
          co.negMonths++;
          if (co.player) news(S, `ALERTA: caixa negativo, sem crédito e sem ônibus para vender (${co.negMonths}º mês). Três meses seguidos levam à falência.`, 'P', 'bad');
        } else {
          co.negMonths = 0;
          if (co.player) { const txt = `Sem limite de crédito, o banco exigiu a venda de ${sold.length} ônibus (carro ${sold.join(', ')}) por 82% do valor para cobrir o caixa negativo.`; news(S, txt, 'P', 'bad'); pushEvent(S, { kind: 'info', title: 'Venda forçada de ônibus', text: txt + ' Linhas que ficaram sem ônibus suficientes vão cancelar partidas.' }); }
        }
      }
    } else co.negMonths = 0;
    checkCovenants(S, co); co._lateNow = false;
    // Linhas: fecha estatísticas do mês
    for (const L of S.lines.filter(l => l.co === co.id)) {
      L.last = { ...L.mon, profit: L.mon.rev - L.mon.cost };
      L.neg = L.last.profit < 0 ? L.neg + 1 : 0;
      if (co.player) L.mgrNote = mgrReport(S, L);
      updateLoyalty(S, co, L);
      L.mon = blankLineMon();
    }
  }
  govProgramMonth(S);
  marketNews(S);
  // IA decide antes de fechar o razão, para que suas compras/vendas caiam no mês que termina
  for (const co of S.cos) if (co.active && !co.player) aiMonthly(S, co);
  maybeNewEntrant(S);
  maybeInvestor(S);
  maybeRegional(S);
  appMonth(S);
  for (const co of S.cos) if (co.active && co.negMonths >= 3) bankrupt(S, co);
  for (const co of S.cos) {
    if (!co.active && !(co.player && S.over && !co._closed)) continue;
    if (co.player && !co.active) co._closed = true;
    const sm = ledSummary(co.led);
    co.hist.push({ y: pt.y, m: pt.m, rec: Math.round(sm.recB), desp: Math.round(sm.desp + sm.dep), op: Math.round(sm.op), net: Math.round(sm.net), cash: Math.round(co.cash),
      pax: (co.month && co.month.pax) || 0, occ: co.month && co.month.seats ? co.month.pax / co.month.seats : 0, fleet: S.buses.filter(b => b.co === co.id).length,
      lines: S.lines.filter(l => l.co === co.id).length, rep: round(co.rep, 1), eq: Math.round(equityOf(S, co)), km: (co.month && co.month.km) || 0 });
    if (co.hist.length > 120) co.hist.shift();
    co.ledPrev = co.led; co._monthPrev = co.month; co.led = {}; co.month = {};
    const nt = calcTier(S, co);
    if (co.player && nt > co.tier) news(S, `Parabéns! ${co.name} agora é "${TIERS[nt - 1].name}".`, 'P', 'good');
    co.tier = Math.max(co.tier, nt);
  }
  // Relatório mensal do jogador
  const P = S.cos[0];
  if (P.active || S.over) {
    const h = P.hist[P.hist.length - 1];
    const rp = { kind: 'mes', y: pt.y, m: pt.m, led: P.ledPrev, sum: ledSummary(P.ledPrev), h, lines: S.lines.filter(l => l.co === 'P').map(l => ({ id: l.id, a: l.a, b: l.b, ...l.last })), share: marketShare(S), brk: P._monthPrev ? P._monthPrev.brk || 0 : 0, acc: P._monthPrev ? P._monthPrev.acc || 0 : 0 };
    rp.story = monthStory(S, P, rp, S.reports[0], dayOf(pt.y, pt.m, 1), prevDay);
    S.reports.unshift(rp);
    if (S.reports.length > 36) S.reports.length = 36;
  }
  // Economia: inflação, diesel, Selic, demanda
  const infl = S.eco.infl + gauss(S) * 0.0012;
  S.eco.ipca *= 1 + infl; S.eco.busIdx *= 1 + infl * 0.9;
  if (pt.m === 11) { const wr = Math.max(0.02, infl * 12 + 0.006); S.eco.wageIdx *= 1 + wr; news(S, `Reajuste anual do salário de mercado: +${round(wr * 100, 1)}%. Funcionários com salário defasado ficam insatisfeitos.`, null, 'info'); }
  // Diesel: acompanha a inflação com ruído; choques (eventos) se dissipam aos poucos em direção ao preço de referência
  // corrigido pela inflação (sem isso, os eventos de alta acumulavam e o diesel real subia 50–100% em 5 anos).
  S.eco.diesel = Math.max(4.5, S.eco.diesel * (1 + infl + gauss(S) * 0.012));
  S.eco.diesel += (DIESEL_BASE * S.eco.ipca - S.eco.diesel) * 0.08;
  S.eco.selic = clamp(S.eco.selic + gauss(S) * 0.18, 6.5, 16);
  // Ciclo econômico: de tempos em tempos (a partir do 2º ano, em média a cada ~4 anos) vem uma recessão que
  // derruba o movimento de 15% a 25% por 1 a 2 anos (crédito mais caro e mais curto), seguida de recuperação gradual. Pune quem se endividou demais.
  const cyc = S.eco.cycle || (S.eco.cycle = { phase: 'normal', since: S.day, depth: 0, until: 0, start: 0 });
  if (cyc.phase === 'normal' && S.day > 540 && S.day - cyc.since > 720 && rnd(S) < 0.04) {
    const months = ri(S, 12, 24); Object.assign(cyc, { phase: 'recessao', depth: rr(S, 0.15, 0.25), start: S.day, until: S.day + Math.round(months * 30.4) });
    const txt = `A economia entrou em recessão. O movimento nas rodoviárias deve cair cerca de ${Math.round(cyc.depth * 100)}% nos próximos ${months} meses, para todas as empresas. Empresas muito endividadas sofrem mais.`;
    news(S, 'Recessão: ' + txt, null, 'bad'); mktLog(S, null, 'Início de uma recessão: demanda em queda.', 'economia');
    pushEvent(S, { kind: 'info', title: 'Recessão econômica', text: txt + ' Revise frequências e tarifas e evite novas dívidas até a recuperação.' });
  } else if (cyc.phase === 'recessao' && S.day >= cyc.until) {
    Object.assign(cyc, { phase: 'recuperacao', start: S.day, until: S.day + 275 });
    news(S, 'A recessão terminou: a demanda volta a crescer aos poucos nos próximos 9 meses.', null, 'good'); mktLog(S, null, 'Fim da recessão: começa a recuperação.', 'economia');
  } else if (cyc.phase === 'recuperacao' && S.day >= cyc.until) Object.assign(cyc, { phase: 'normal', since: S.day, depth: 0 });
  const target = cyc.phase === 'recessao' ? 1 - cyc.depth : cyc.phase === 'recuperacao' ? 1 - cyc.depth * Math.max(0, (cyc.until - S.day) / 275) : 1;
  S.eco.demand = clamp(S.eco.demand + (target - S.eco.demand) * 0.15 + gauss(S) * 0.012, 0.7, 1.15);
  S.eco.growth = (S.eco.growth || 1) * 1.0014; // ~1,7% ao ano de crescimento estrutural
  ensureCompetitors(S);
  if (S.cos[0].active) checkGoals(S);
  refreshUsed(S); refreshCands(S);
  // Modificadores expirados
  S.mods = S.mods.filter(m => m.until >= S.day);
}

/** Relatório mensal em texto, montado só a partir do que aconteceu (razão, viagens, linhas e notícias do mês).
 *  Cada frase traz o número que a sustenta; nada é inventado nem atribuído a intenção de terceiros. */
function monthStory(S, P, rp, prev, d0, d1) {
  const out = [], m = v => fmtMoney(Math.abs(v)), sg = v => (v >= 0 ? '+' : '−') + fmtMoney(Math.abs(v)), pc = v => (v >= 0 ? '+' : '−') + Math.abs(Math.round(v * 100)) + '%';
  const sm = rp.sum, h = rp.h, ph = prev && prev.h;
  // 1) Resultado
  let t = `Lucro operacional de ${sg(sm.op)}`;
  if (prev) { const d = sm.op - prev.sum.op; if (Math.abs(d) >= 1000) t += ` (${d >= 0 ? m(d) + ' a mais' : m(d) + ' a menos'} que em ${MONTHS[prev.m]})`; }
  out.push({ k: sm.op >= 0 ? 'ok' : 'bad', txt: t + '.' });
  // 2) Receita: passageiros, tarifa média e ocupação
  if (ph && h && ph.pax > 0 && h.pax > 0) {
    const dp = h.pax / ph.pax - 1, tk = (rp.led.passagens || 0) / h.pax, tk0 = (prev.led.passagens || 0) / ph.pax, dt = tk0 ? tk / tk0 - 1 : 0;
    const parts = []; if (Math.abs(dp) >= 0.02) parts.push(`${pc(dp)} de passageiros (${(h.pax).toLocaleString('pt-BR')})`); if (Math.abs(dt) >= 0.02) parts.push(`${pc(dt)} na tarifa média paga (R$ ${Math.round(tk)})`);
    if (Math.abs(h.occ - ph.occ) >= 0.03) parts.push(`ocupação de ${Math.round(ph.occ * 100)}% para ${Math.round(h.occ * 100)}%`);
    if (parts.length) out.push({ k: dp + dt >= 0 ? 'ok' : 'warn', txt: `Receita bruta de ${m(sm.recB)}: ${parts.join(', ')} em relação a ${MONTHS[prev.m]}.` });
  }
  // 3) Custos que mais mudaram
  if (prev) {
    const cats = ['combustivel', 'pedagios', 'manutencao', 'bordo', 'ocorrencias', 'salarios', 'seguros', 'administrativas', 'terminais', 'juros'];
    const ch = cats.map(c => ({ c, d: (rp.led[c] || 0) - (prev.led[c] || 0) })).filter(x => Math.abs(x.d) >= Math.max(5000, sm.recB * 0.03)).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 2);
    if (ch.length) out.push({ k: ch[0].d > 0 ? 'warn' : 'ok', txt: 'Custos que mais mudaram: ' + ch.map(x => `${LEDGER[x.c].label.toLowerCase()} ${sg(x.d)}`).join('; ') + '.' });
  }
  // 4) Operação
  const canc = sum(rp.lines, l => l.cancel || 0), late = sum(rp.lines, l => l.late || 0), lost = Math.round(sum(rp.lines, l => l.lost || 0)), trips = sum(rp.lines, l => l.trips || 0);
  const op = [];
  if (canc) op.push(`${canc} partida(s) cancelada(s)`); if (rp.brk) op.push(`${rp.brk} pane(s)`); if (rp.acc) op.push(`${rp.acc} acidente(s)`);
  if (trips && late / trips >= 0.1) op.push(`${Math.round(late / trips * 100)}% das viagens com atraso`);
  if (lost >= 30) op.push(`~${lost.toLocaleString('pt-BR')} passageiros que quiseram viajar e não conseguiram (ônibus lotado ou partida cancelada)`);
  if (op.length) out.push({ k: canc || rp.brk || rp.acc ? 'warn' : 'info', txt: `Operação: ${trips.toLocaleString('pt-BR')} viagens; ${op.join(', ')}.` });
  // 5) Linhas
  const ls = rp.lines.filter(l => l.trips > 0).sort((a, b) => a.profit - b.profit);
  if (ls.length >= 2) {
    const neg = ls.filter(l => l.profit < 0), best = ls[ls.length - 1];
    const nm = l => `${placeName(l)}`;
    let tt = `Melhor linha: ${nm(best)} (${sg(best.profit)}).`;
    if (neg.length) tt += ` ${neg.length} linha(s) no prejuízo, a pior ${nm(ls[0])} (${sg(ls[0].profit)}).`;
    out.push({ k: neg.length ? 'warn' : 'ok', txt: tt });
  }
  // 6) Concorrência nas suas rotas (o que de fato aconteceu)
  const comp = (S.news || []).filter(n => n.day >= d0 && n.day <= d1 + 1 && /^Concorrência!/.test(n.txt)).map(n => n.txt.replace(/^Concorrência! /, ''));
  if (comp.length) out.push({ k: 'warn', txt: `Concorrência: ${comp.slice(0, 2).join(' ')}${comp.length > 2 ? ` (e mais ${comp.length - 2})` : ''}` });
  // 7) Caixa: de onde veio e para onde foi
  const L = rp.led, g = c => L[c] || 0, fl = sm.flow;
  const br = [`operação ${sg(sm.cashOp + sm.juros)}`];
  if (g('juros')) br.push(`juros −${m(g('juros'))}`);
  if (g('investimentos')) br.push(`investimentos −${m(g('investimentos'))}`);
  if (g('vendaAtivos')) br.push(`venda de ônibus +${m(g('vendaAtivos'))}`);
  if (g('emprestimos')) br.push(`empréstimos +${m(g('emprestimos'))}`);
  if (g('amortizacao')) br.push(`pagamento de dívidas −${m(g('amortizacao'))}`);
  out.push({ k: fl >= 0 ? 'info' : 'warn', txt: `O caixa ${fl >= 0 ? 'aumentou' : 'diminuiu'} ${m(fl)}: ${br.join(', ')}.${sm.dep > 0 ? ` A depreciação (${m(sm.dep)}) reduz o lucro, mas não sai do caixa.` : ''}` });
  // 8) Por que o mês foi negativo
  if (sm.op < 0) {
    const why = [];
    const contrib = sm.recL - sm.vars;
    if (contrib > 0 && sm.fix > contrib) why.push(`as viagens deixaram ${m(contrib)} depois dos custos variáveis, menos que os custos fixos (${m(sm.fix)}: salários, seguros, administração e terminais)`);
    if (contrib <= 0) why.push(`a receita líquida (${m(sm.recL)}) não cobriu nem os custos das viagens (${m(sm.vars)})`);
    if (prev && (L.manutencao || 0) > (prev.led.manutencao || 0) * 1.4 && (L.manutencao || 0) - (prev.led.manutencao || 0) > 10000) why.push(`a manutenção subiu ${m((L.manutencao || 0) - (prev.led.manutencao || 0))}`);
    if (canc >= 10) why.push(`${canc} partidas canceladas`);
    const negL = ls.filter(l => l.profit < 0); if (negL.length) why.push(`${negL.length} linha(s) deram prejuízo somando ${m(sum(negL, l => l.profit))}`);
    if (why.length) out.push({ k: 'bad', txt: 'Por que o mês fechou no negativo: ' + why.join('; ') + '.' });
  }
  return out;
}
function bankrupt(S, co) {

  }

  co.closed = { day: S.day, fleet: S.buses.filter(b => b.co === co.id).length, lines: S.lines.filter(l => l.co === co.id).length, debt: Math.round(debtOf(co)),
    loss3: Math.round(sum(h3, h => h.net)), why: co.closed && co.closed.why ? co.closed.why : 'caixa negativo e sem crédito', to: null };

  offerAcquisitionOfBankrupt(S, co);
}

/* METAS (banco e empresa)                                             */
/* ------------------------------------------------------------------ */
/** Valor atual de uma meta. */
function goalValue(S, g) {
  const P = S.cos[0], h = P.hist[P.hist.length - 1];
  switch (g.kind) {
    case 'debt': return debtOf(P);
    case 'bankDebt': return bankDebtOf(P);
    case 'cash': return P.cash;
    case 'pax': return (P.month && P.month.pax) || 0;
    case 'occ': return P.month && P.month.seats ? P.month.pax / P.month.seats : 0;
    case 'rep': return P.rep;
    case 'fleet': return S.buses.filter(b => b.co === 'P').length;
    case 'profit': return h ? h.op : 0;
  }
  return 0;
}
function goalMet(S, g) { const v = goalValue(S, g); return g.kind === 'debt' || g.kind === 'bankDebt' ? v <= g.target : v >= g.target; }
function addGoal(S, g) { g.id = nid(S, 'g'); g.start = S.day; g.status = 'ativa'; g.base = goalValue(S, g); S.goals.push(g); news(S, `Nova meta (${g.src}): ${g.title}.`, 'P', 'info'); S.notes.push({ k: 'slow', txt: 'Nova meta: ' + g.title }); return g; }
/** Meta inicial do banco, proporcional à dívida do cenário. */
function initGoals(S) {
  S.goals = [];
  const P = S.cos[0];
  if (bankDebtOf(P) > 0) addGoal(S, bankGoal(S, 365));
  newCompanyGoal(S);
}
/** Dívida "solta": capital de giro + cheque especial (financiamentos de ônibus ficam de fora). */
function bankDebtOf(co) { return sum(co.loans.filter(l => l.kind !== 'onibus' && l.kind !== 'trabalhista'), l => l.bal); }
/** Saldo projetado de um empréstimo após n meses pagando em dia. */
function projBal(L, n) {
  n = Math.min(n, L.left); if (n <= 0) return L.bal;
  if (!L.rate) return Math.max(0, L.bal - L.pay * n);
  const g = Math.pow(1 + L.rate, n);
  return Math.max(0, L.bal * g - L.pay * (g - 1) / L.rate);
}
/** Meta do banco: manter capital de giro + cheque especial no ritmo normal das parcelas (+5% de folga). */
function bankGoal(S, days) {
  const P = S.cos[0], months = Math.round(days / 30.4);
  const proj = sum(P.loans.filter(l => l.kind !== 'onibus'), l => projBal(l, months));
  const target = Math.ceil(proj * 1.05 / 1000) * 1000 + 10000;
  return { src: 'banco', kind: 'bankDebt', target, deadline: S.day + days,
    title: `Manter capital de giro + cheque especial abaixo de ${fmtMoney(target)} até ${fmtDate(S.day + days)} (financiamentos de ônibus não contam)`,
    reward: 'Nota de crédito melhor por 12 meses (juros menores, limite maior)', penalty: 'Nota rebaixada por 12 meses e reputação −3' };
}
function fmtMoney(v) { return 'R$ ' + Math.round(v).toLocaleString('pt-BR'); }
/** Saves antigos: a meta do banco somava financiamentos de ônibus; recalcula com a regra nova. */
function migrateGoals(S) {
  for (const g of S.goals || []) {
    if (g.status !== 'ativa' || g.src !== 'banco' || g.kind !== 'debt') continue;
    const ng = bankGoal(S, Math.max(30, g.deadline - S.day));
    Object.assign(g, { kind: 'bankDebt', target: ng.target, title: ng.title, base: bankDebtOf(S.cos[0]) });
  }
}
/** Metas da diretoria: uma ativa por vez, ajustada ao tamanho da empresa. */
function newCompanyGoal(S) {
  const P = S.cos[0], h = P.hist[P.hist.length - 1], fleet = S.buses.filter(b => b.co === 'P').length;
  const opts = [
    () => ({ kind: 'pax', target: Math.round(Math.max(1500, (h ? h.pax : fleet * 1800) * 1.15) / 100) * 100, months: 1, label: v => `Transportar ${v.toLocaleString('pt-BR')} passageiros num mês` }),
    () => ({ kind: 'occ', target: 0.66, months: 1, label: () => 'Fechar um mês com ocupação média de 66% ou mais' }),
    () => ({ kind: 'rep', target: Math.min(95, Math.round(P.rep + 6)), months: 4, label: v => `Chegar a ${v} de reputação` }),
    () => ({ kind: 'fleet', target: fleet + Math.max(2, Math.round(fleet * 0.3)), months: 6, label: v => `Ter ${v} ônibus na frota` }),
    () => ({ kind: 'profit', target: Math.round(Math.max(50000, (h ? Math.max(0, h.op) : 0) * 1.25) / 1000) * 1000, months: 3, label: v => `Fechar um mês com lucro operacional de ${fmtMoney(v)}` })
  ];
  const o = pick(S, opts)();
  const dl = dayOf(dateOf(S.day + o.months * 31).y, dateOf(S.day + o.months * 31).m, 1) - 1;
  addGoal(S, { src: 'diretoria', kind: o.kind, target: o.target, deadline: dl, monthly: ['pax', 'occ', 'profit'].includes(o.kind),
    title: o.label(o.target) + ` até ${fmtDate(dl)}`, reward: 'Bônus: +2 de reputação e desconto de 5% no próximo ônibus novo', penalty: 'Nenhuma (só a oportunidade perdida)' });
}
/** Avalia metas no fechamento do mês (as mensais usam o mês que acabou). */
function checkGoals(S, closingMonth) {
  const P = S.cos[0];
  if (!S.goals) initGoals(S);
  for (const g of S.goals) {
    if (g.status !== 'ativa') continue;
    let met;
    if (g.monthly) { const h = P.hist[P.hist.length - 1]; met = h && (g.kind === 'pax' ? h.pax >= g.target : g.kind === 'occ' ? h.occ >= g.target : h.op >= g.target); }
    else met = goalMet(S, g);
    if (met) {
      g.status = 'cumprida'; g.end = S.day;
      if (g.src === 'banco') { P.bankMod = { pts: 2, until: S.day + 365 }; news(S, `Meta do banco cumprida! Sua nota de crédito melhora por 12 meses.`, 'P', 'good'); }
      else { P.rep = Math.min(99, P.rep + 2); P.busDiscount = 0.05; news(S, `Meta cumprida: ${g.title}. +2 de reputação e 5% de desconto no próximo ônibus novo.`, 'P', 'good'); }
      pushEvent(S, { kind: 'info', title: 'Meta cumprida', text: g.title + '. Recompensa: ' + g.reward + '.' });
    } else if (S.day >= g.deadline) {
      g.status = 'falhou'; g.end = S.day;
      if (g.src === 'banco') { P.bankMod = { pts: -3, until: S.day + 365 }; P.rep = Math.max(1, P.rep - 3); pushEvent(S, { kind: 'info', title: 'Meta do banco não cumprida', text: `O banco rebaixou sua nota de crédito por 12 meses: juros maiores e limite menor. Reputação −3.` }); }
      else news(S, `Meta não cumprida: ${g.title}.`, 'P', 'warn');
    }
  }
  if (!S.goals.some(g => g.status === 'ativa' && g.src === 'diretoria')) newCompanyGoal(S);
  if (!S.goals.some(g => g.status === 'ativa' && g.src === 'banco') && bankDebtOf(P) > Math.max(150000, fleetValue(S, P) * 0.25) && rnd(S) < 0.5) addGoal(S, bankGoal(S, 270));
  if (S.goals.length > 30) S.goals = S.goals.filter(g => g.status === 'ativa').concat(S.goals.filter(g => g.status !== 'ativa').slice(-20));
}

function aiLog(S, co, txt) { co.lastActions.unshift({ day: S.day, txt }); if (co.lastActions.length > 12) co.lastActions.length = 12; mktLog(S, co.id, txt); }
/** Linha do tempo do mercado (12 meses). */
function mktLog(S, coId, txt, kind) {

  while (S.mktLog.length && S.mktLog[S.mktLog.length - 1].day < S.day - 400) S.mktLog.pop();
  if (S.mktLog.length > 300) S.mktLog.length = 300;

/** Revisão semanal de preços da IA, baseada em ocupação, concorrência e custos. */
function aiPricing(S, co) {
  const p = PERSONAS[co.persona];
  for (const L of S.lines.filter(l => l.co === co.id)) {
    if (L.conc) continue; // tarifa regulada pelo contrato
    if (!L.buses.length || L.ema.seats < 1) continue;
    // Guerra de preço anunciada: mantém a tarifa cortada por ~2,5 meses (antes voltava a subir em poucas semanas,
    // contradizendo a notícia), salvo se a linha passar a dar prejuízo.
    if (L.priceWar > S.day && L.ema.rev >= L.ema.cost) continue;
    const r = ROUTES[L.route];
    const occ = L.ema.pax / L.ema.seats;
    const cat = L.cat || 'conv';
    const ref = baseFare(S, r.dist) * CATS[cat].ref * p.priceMult;
    let np = L.price;
    if (occ > 0.86) np *= 1.04; else if (occ > 0.75) np *= 1.015;
    else if (occ < 0.45) np *= 0.96; else if (occ < 0.58) np *= 0.985;
    // Reage a quem cobra muito menos na mesma rota
    const rivals = S.lines.filter(x => x.route === L.route && x.co !== co.id && x.buses.length);
    if (rivals.length && (p.undercut || occ < 0.6)) {
      const minP = Math.min(...rivals.map(x => x.price / CATS[x.cat || 'conv'].ref)) * CATS[cat].ref;
      if (minP < np * 0.88) np = np * 0.97;
    }
    // Volta lentamente para a referência
    np += (ref - np) * 0.06;
    // Piso: custo por passageiro com margem mínima
    // Piso de custo só vale para linhas já maduras (linha nova ainda está enchendo)
    const costPax = L.ema.pax > 0 ? L.ema.cost / L.ema.pax : 0;
    if (costPax > 0 && awareness(S, L) >= 1 && L.ema.seats > 0 && L.ema.pax / L.ema.seats > 0.4) np = Math.max(np, Math.min(costPax * (p.undercut ? 0.98 : 1.04), L.price * 1.06));
    np = clamp(np, Math.max(ref * 0.6, L.price * 0.94), Math.min(ref * 1.6, L.price * 1.06));
    L.price = Math.round(np);
  }
}

/** Concorrentes reagem ao sucesso do jogador: entram na rota, baixam preço ou reforçam. */
function aiReact(S) {
  const P = S.cos[0]; if (!P.active || S.day < 365) return; // carência no primeiro ano de carreira
  for (const L of S.lines.filter(l => l.co === 'P' && l.buses.length)) {
    if (S.day - L.opened < 240 || (L.lastReact && S.day - L.lastReact < 180)) continue; // linha precisa de ~8 meses de vida
    const occ = L.ema.seats ? L.ema.pax / L.ema.seats : 0;
    const perBus = (L.ema.rev - L.ema.cost) / Math.max(1, L.buses.length);
    if (occ < 0.72 || perBus < 1400 * S.eco.ipca) continue;
    if (rnd(S) > (S.day > 730 ? 0.35 : 0.25)) continue; // mercado disputado: reagem mais
    const r = ROUTES[L.route];
    const W = { agressiva: 3, expansionista: 2.2, economica: 1.4, regional: 1.6, premium: 0.8 };
    const cands = S.cos.filter(c => !c.player && c.active && c.cash > 400000 * S.eco.busIdx && c.states.includes(CITY[r.a].uf) && c.states.includes(CITY[r.b].uf));
    if (!cands.length) continue;
    let tot = sum(cands, c => W[c.persona]), x = rnd(S) * tot, ai = cands[0];
    for (const c of cands) { x -= W[c.persona]; if (x <= 0) { ai = c; break; } }
    const mine = S.lines.find(l => l.co === ai.id && l.route === L.route);
    const route = `${placeName(r)}`;
    let txt = null;
    if (!mine) continue; // sem concessão na rota: não pode entrar
    if (mine && mine.conc && (ai.persona === 'agressiva' || ai.persona === 'economica') && !(mine.promo && S.day - mine.promo.start < 60)) {
      const pct = ai.persona === 'agressiva' ? 0.15 : 0.1; mine.promo = { pct, start: S.day, until: S.day + 30 }; mine.price = concFare(S, mine);
      txt = `${ai.name} lançou promoção de ${Math.round(pct * 100)}% em ${route} para recuperar passageiros.`;
    } else if (mine) {
      if (false) { mine.price = Math.round(Math.min(mine.price, L.price * rr(S, 0.84, 0.92))); mine.priceWar = S.day + 75; txt = `${ai.name} baixou a tarifa em ${route} para R$ ${mine.price} (a sua é R$ ${L.price}).`; }
      else { const b = aiBuyBus(S, ai, mine.cat || 'conv'); if (b) { assignBusRaw(S, b, mine); mine.freq = Math.max(mine.freq, Math.floor(planCapacity(S, mine, mine.buses) / 2)); txt = `${ai.name} reforçou ${route} com mais um ônibus (${mine.freq}× por sentido).`; } }
    } else {
      const cat = ai.persona === 'premium' ? pick(S, ['semi', 'leito']) : (L.cat === 'conv' ? 'conv' : pick(S, ['conv', 'exec']));
      const price = ai.persona === 'premium' ? baseFare(S, r.dist) * CATS[cat].ref : L.price * rr(S, 0.9, 0.97) * CATS[cat].ref / CATS[L.cat || 'conv'].ref;
      // Só entra se a conta fechar para ela também
      const mm = MODELS[aiChooseModel(S, ai, cat)];
      const est = estimateLine(S, ai.id, L.route, price, mm.comfort, mm.cap, 1);
      if (est.profitDay <= 0 || est.occ < 0.55) continue;
      const NL = makeLine(S, ai.id, L.route, price, 1); NL.cat = cat;
      const need = busesNeeded(S, L.route, aiChooseModel(S, ai, cat), 1);
      let got = 0; for (let i = 0; i < need; i++) { const b = aiBuyBus(S, ai, cat); if (!b) break; assignBusRaw(S, b, NL); got++; }
      if (got < need) { closeLineRaw(S, NL); continue; }
      NL.freq = Math.max(1, Math.floor(planCapacity(S, NL, NL.buses) / 2));
      txt = `${ai.name} entrou na sua linha ${route} com ${CATS[cat].label.toLowerCase()} a R$ ${Math.round(price)} (a sua é R$ ${L.price}).`;
    }
    if (!txt) continue;
    L.lastReact = S.day;
    aiLog(S, ai, txt.replace(ai.name + ' ', ''));
    news(S, 'Concorrência! ' + txt, ai.id, 'warn');
    S.notes.push({ k: 'slow', t: 'concorrencia', txt: 'Concorrência! ' + txt });
    pushEvent(S, { kind: 'info', title: 'Reação da concorrência', text: txt + ' Sua linha estava lucrativa e chamou atenção. Reveja tarifa, frequência e conforto.' });
  }
}
/** Escolhe o modelo a comprar conforme personalidade e dinheiro. */
function aiChooseModel(S, co, catPref) {
  const opts = Object.keys(MODELS).filter(k => MODELS[k].cat === catPref);

/** IA compra um ônibus (usado ou novo), respeitando caixa e crédito. */
function aiBuyBus(S, co, cat) {
  const p = PERSONAS[co.persona];

    const opts = S.used.filter(u => MODELS[u.model].cat === cat && curYear(S) - u.year <= p.maxAge - 2 && u.price < co.cash - reserve).sort((a, b) => b.cond - a.cond);
    if (opts.length) {

      book(S, co, 'investimentos', u.price);
      aiLog(S, co, `Comprou ${MODELS[u.model].brand} ${MODELS[u.model].name} usado (${u.year}).`);
      return orderBus(S, co, u.model, u.year, u.km, u.cond, ri(S, 5, 10), { paid: u.price });
    }
  }
  const mid = aiChooseModel(S, co, cat);
  const price = modelPrice(S, mid);

    // mesmas regras do jogador: programa do governo se aberto; senão Finame (nota B+) ou CDC

    const F = FIN[mode], fin = price * 0.8, months = F.months[F.months.length - 1], rate = finRate(S, co, mode);
    if (finCheck(S, co, mode, fin, months, rate)) return null;
    book(S, co, 'investimentos', price * 0.2);
    if (mode === 'gov') S.gov.left--;
    aiLog(S, co, `Encomendou ${MODELS[mid].brand} ${MODELS[mid].name} 0 km (${F.label}).`);
    return orderBus(S, co, mid, curYear(S), 0, 100, ri(S, F.days[0], F.days[1]), { mode, fin, rate, months, label: F.label, paid: price * 0.2 });
  }

}
function aiSellBus(S, co, b) {

/** Gasto mensal aproximado (para reservas de caixa). */
function monthlyBurn(S, co) {

/** Novas empresas: quando o mercado tem menos concorrentes que no início (falências), surge uma pequena empresa. */
const ENTRANT_NAMES = ['Viação Horizonte Novo', 'Expresso Trilhas', 'Rápido Cerrado', 'Viação Boa Estrada', 'Expresso Litoral Sul', 'Viação Planalto Verde', 'Rota Sertaneja', 'Expresso Vale do Sol', 'Viação Estrela Guia', 'Transportes Ponte Alta', 'Expresso Canaã', 'Viação Pioneira'];

/** Decisões mensais da IA: cortar, reforçar, expandir, renovar. */
/** IA: monta base de motoristas quando o retorno é rápido (até 6 meses), no máximo 3. Fecha base que deu prejuízo. */
function aiBases(S, co) {
  if (!co.active) return;
  co.bases = co.bases || [];
  if (S.lines.filter(l => l.co === co.id).length < 3) return;
  const opts = baseOptions(S, co);
  for (const o of opts) if (o.has && o.net < -5000 * S.eco.ipca) { co.bases = co.bases.filter(c => c !== o.city); }
  if (co.bases.length >= 3) return;
  const best = opts.find(o => !o.has && o.net > 0 && o.months && o.months <= 6);
  if (!best || co.cash < baseSetup(S) * 3) return;
  book(S, co, 'administrativas', baseSetup(S)); co.bases.push(best.city);

}
function aiMonthly(S, co) {
  const p = PERSONAS[co.persona];

  if (!S.buses.some(b => b.co === co.id) && !(S.auctions || []).some(a => !a.done && a.co === co.id)) {
    co.active = false;
    S.lines.filter(l => l.co === co.id).forEach(L => closeLineRaw(S, L));
    co.closed = { day: S.day, fleet: 0, lines: 0, debt: Math.round(debtOf(co)), loss3: Math.round(sum(co.hist.slice(-3), h => h.net)), why: 'vendeu toda a frota e fechou', to: null };
    news(S, `${co.name} vendeu o último ônibus e encerrou as atividades.`, co.id, 'bad');
    mktLog(S, co.id, 'Encerrou as atividades sem frota.', 'falencia');
