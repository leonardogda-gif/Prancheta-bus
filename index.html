  }
  aiExtend(S, co);
  co.mgmt = clamp(mgmtOf(co) + gauss(S) * 0.012 + (1 - mgmtOf(co)) * 0.01, 0.75, 1.15); // gestão muda devagar (troca de diretoria, sucessão)
  // Empresa mal administrada também opera mal: não limpa os ônibus todo dia e deixa a frota se desgastar mais
  const sloppy = co.mgmt < 0.9;
  co.policy.autoClean = p !== PERSONAS.economica && !sloppy;
  co.policy.reviseCond = p.reviseCond - (sloppy ? 12 : 0);
  const lines = S.lines.filter(l => l.co === co.id);
  const burn = monthlyBurn(S, co);
  const reserve = burn * p.reserve;
  // 1) Linhas deficitárias: reduz frequência ou fecha
  for (const L of lines) {
    if (!L.last) continue;
    const occ = L.last.seats ? L.last.pax / L.last.seats : 0;
    const patience = 3 + Math.round((1 - mgmtOf(co)) * 10); // gestão ruim demora a cortar linha que dá prejuízo
    if (L.obrig && L.obrig.until > S.day) continue; // compromisso com o governo: mantém
    if (L.conc && co.negMonths < 2) continue; // concessão: cumpre o contrato (devolver custa multa)
    if (L.neg >= patience || (L.neg >= patience - 1 && co.cash < reserve)) {
      aiLog(S, co, `Encerrou a linha ${lineRef(L)}.`);
      news(S, `${co.name} encerrou a linha ${lineRef(L)}.`, co.id);
      closeLineRaw(S, L);
    } else if (occ < 0.42 && L.freq > 1 && (!L.conc || L.freq - 1 >= L.conc.minF)) {
      L.freq--; const extra = L.buses.length > 1 ? S.busMap[L.buses[L.buses.length - 1]] : null;
      if (extra && planCapacity(S, L, L.buses.slice(0, -1)) >= L.freq * 2) unassign(S, extra);
      aiLog(S, co, `Reduziu frequência em ${lineRef(L)}.`);
    }
  }
  // 2) Caixa apertado: vende ônibus ociosos ou os piores; pega capital de giro
  const idle = () => S.buses.filter(b => b.co === co.id && !b.line && b.status !== 'manut' && b.status !== 'entrega');
  if (co.cash < reserve * 0.5) {
    const lim = creditLimit(S, co);
    if (rnd(S) < p.loan + 0.3 && lim > 100000 && !finCheck(S, co, 'capital', Math.min(lim, Math.max(200000, reserve - co.cash)), 24, loanRate(S, co, 'capital'))) { const amt = Math.min(lim, Math.max(200000, reserve - co.cash)); addLoan(S, co, 'capital', amt, loanRate(S, co, 'capital'), 24, 'Capital de giro'); aiLog(S, co, 'Contratou capital de giro.'); }
    for (const b of idle().slice(0, 3)) aiSellBus(S, co, b);
    // Sem caixa, sem crédito e sem ônibus sobrando: em vez de desmontar a frota ônibus a ônibus,
    // a empresa quebra com frota e linhas — e vai a leilão (massa falida), onde dá para comprá-la.

  }
  // 3) Linhas lotadas e lucrativas: reforça
  for (const L of S.lines.filter(l => l.co === co.id)) {
    if (!L.last || L.last.profit <= 0) continue;
    const occ = L.last.seats ? L.last.pax / L.last.seats : 0;
    if (occ > 0.8 && L.last.lost > L.last.pax * 0.08) {
      const cap = planCapacity(S, L, L.buses);
      if (cap >= (L.freq + 1) * 2) { L.freq++; aiLog(S, co, `Aumentou frequência em ${lineRef(L)}.`); continue; }
      let b = idle().find(x => MODELS[x.model].cat === L.cat) || idle()[0];
      if (!b && co.cash > reserve) b = aiBuyBus(S, co, L.cat || 'conv');
      if (b) { assignBusRaw(S, b, L); if (planCapacity(S, L, L.buses) >= (L.freq + 1) * 2) L.freq++; aiLog(S, co, `Reforçou ${lineRef(L)}.`); }
    }
  }
  // 3a) Pedido do governo (linha obrigatória): a IA aceita se tiver como operar
  if (false) {
    const r = obligationRoute(S, co);
    if (r) { const b = idle()[0];
      if (b || co.cash > reserve + modelPrice(S, 'vx330')) { const o = obligationOffer(S, co, r), L = acceptObligation(S, co, o); const nb = b || aiBuyBus(S, co, 'conv'); if (nb) { assignBusRaw(S, nb, L); aiLog(S, co, `Assumiu linha pedida pelo governo: ${lineRef(L)}.`); } else closeLineRaw(S, L); }
      else co.rep = Math.max(1, co.rep - 3); }
  }
  // 3b) Saídas noturnas
  for (const L of S.lines.filter(l => l.co === co.id)) aiNight(S, co, L);
  // 4) Expansão
  const info = staffInfo(S, co);
  // Expansão: quem aceita dívida (expansionista, agressiva) cresce financiada, com menos caixa e mais alavancagem
  const lev = 0.65 + p.loan * 0.2 + (1 - mgmtOf(co)) * 0.4, cashNeed = p.loan >= 0.6 ? reserve * 0.6 + 250000 * S.eco.busIdx : reserve + 600000 * S.eco.busIdx;
  // (expansão só por licitação — ver resolveTender)
  aiMobilize(S, co);
  // de vez em quando pede licença num estado vizinho para disputar mais editais
  if (rnd(S) < 0.03 * (0.5 + p.expand) && co.cash > monthlyBurn(S, co) * 3) {
    const near = [...new Set(ROUTE_LIST.filter(r => co.states.includes(CITY[r.a].uf) || co.states.includes(CITY[r.b].uf)).flatMap(r => routeUFs(r)))].filter(u => !co.states.includes(u));
    if (near.length) { const u = pick(S, near), c = licenseCost(S, co); book(S, co, 'investimentos', c); co.states.push(u); mktLog(S, co.id, `Obteve licença em ${UF[u].name}.`, 'entrada'); }
  }
  // 5) Renovação de frota
  for (const b of S.buses.filter(x => x.co === co.id)) {
    if (busAge(S, b) > p.maxAge && b.status !== 'entrega' && co.cash > reserve + modelPrice(S, b.model) * 0.6) {
      const L = b.line ? S.lines.find(l => l.id === b.line) : null;
      const nb = aiBuyBus(S, co, MODELS[b.model].cat);
      if (nb) { if (L) assignBusRaw(S, nb, L); aiSellBus(S, co, b); }
      break;
    }
  }
  // 6) Ociosos há tempo: vende
  const willNeed = S.lines.some(l => l.co === co.id && l.opened > S.day) || (S.tenders || []).some(t => !t.done && t.lots.some(l => l.bids.some(b => b.co === co.id)));
  for (const b of idle()) { if (!willNeed && S.day - (b.idleSince || S.day) > 50) aiSellBus(S, co, b); else if (!b.idleSince || willNeed) b.idleSince = S.day; }
  // 7) Garagem: amplia se a fila vive cheia
  if (co.garage.jobs.length > co.garage.bays && co.cash > reserve + 300000) { book(S, co, 'investimentos', garageCost(S, co)); co.garage.bays++; }
  // 8) Quita cheque especial se puder
  const od = co.loans.find(l => l.kind === 'cheque');
  if (od && co.cash > od.bal + reserve) { book(S, co, 'amortizacao', od.bal); co.loans.splice(co.loans.indexOf(od), 1); }
  // 9) Distribui dividendos quando o caixa sobra muito (sócios retiram lucros)
  const excess = co.cash - burn * (4 + p.reserve * 2);
  if (excess > 0 && debtOf(co) < co.cash) book(S, co, 'dividendos', excess * (0.35 + (1 - mgmtOf(co)) * 1.2));
  aiStaff(S, co);
}

/** Capacidade de viagens/dia de um conjunto de ônibus numa linha. */
function planCapacity(S, L, busIds, withPending) {
  const r = ROUTES[L.route];
  const bs = busIds.map(id => (S.busMap && S.busMap[id]) || S.buses.find(x => x.id === id)).filter(b => b && (withPending || b.status !== 'entrega'));
  if (!bs.length) return 0;
  const h0 = Math.max(...bs.map(b => tripHours(S, b, r)));
  // Linha com saídas noturnas: elas ocupam ônibus (o da noite fica fora boa parte do dia seguinte).
  // Capacidade = saídas de DIA que cabem junto com as noturnas atuais.
  const fN = L.freqN || 0;
  const autoN = !fN && L.cat && ['semi', 'leito', 'dd'].includes(L.cat) && tripHoursBase(r) >= 5; // noturna automática (depSplit)
  if ((fN || autoN) && h0 < 14) { let best = 0; for (let n = 1; n <= 24; n++) { if (L.id ? planFitsL(S, L, bs, n, fN) : planFits(S, r, bs, n, fN)) best = n; else if (n > best + 2) break; } return best * 2; }
  if (h0 >= 14) return Math.max(0, Math.floor(sum(bs, b => 24 / (tripHours(S, b, r) + turnaround(tripHours(S, b, r)))) + 1e-6) - 2 * fN);
  // Trechos curtos/médios: testa a escala com ônibus divididos entre os dois terminais
  let best = 0;
  for (let n = 1; n <= 24; n++) {
    const cur = bs.map((b, i) => ({ b, t: 4.5 / 24, drive: 0, loc: i % 2 }));
    if (schedule(S, r, cur, n, 0).length >= 2 * n) best = n; else if (n > best + 2) break;
  }
  return best * 2;
}

/** IA avalia rotas e abre a melhor, se o retorno estimado compensar. */
/** IA: prepara a frota das concessões que vai começar (ou que estão sem ônibus) e cumpre o mínimo do contrato. */
function aiMobilize(S, co) {
  const okFor = (b, c, L) => CAT_LEVEL[MODELS[b.model].cat] >= CAT_LEVEL[c.minCat] && !busTooOldFor(S, b, L);
  for (const L of S.lines.filter(l => l.co === co.id && l.conc)) {
    const c0 = L.conc; if (S.day < L.opened - 90) continue;
    const c = c0.next && S.day >= c0.end - 50 ? c0.next : c0;
    if (L.freq < c.minF) L.freq = c.minF;
    if ((L.freqN || 0) < (c.nightMin || 0)) L.freqN = c.nightMin;
    // conta só os ônibus que estarão disponíveis a tempo (entrega até o início, ou até 10 dias se a linha já roda)
    const by = Math.max(L.opened, S.day + 10);
    const avail = () => L.buses.map(id => S.busMap[id] || S.buses.find(b => b.id === id)).filter(b => b && b.status !== 'parado' && !(b.status === 'entrega' && b.ready > by));
    const running = S.day >= L.opened - 20;
    let guard = 0;
    while (!planFits(S, ROUTES[L.route], avail(), c.minF, c.nightMin || 0) && guard++ < 5) {
      // 1) reserva própria
      let nb = S.buses.find(b => b.co === co.id && !b.line && b.status === 'ativo' && okFor(b, c, L));
      // 2) ônibus que sobra em outra linha da própria empresa (sem quebrar o mínimo dela)
      if (!nb) for (const L2 of S.lines.filter(l => l.co === co.id && l.id !== L.id && l.opened <= S.day)) {
        const bs2 = L2.buses.map(id => S.busMap[id]).filter(b => b && b.status === 'ativo');
        const c2 = L2.conc, f2 = c2 ? c2.minF : 1, n2 = c2 ? c2.nightMin || 0 : 0;
        const cand = bs2.filter(b => okFor(b, c, L)).find(b => planFits(S, ROUTES[L2.route], bs2.filter(x => x !== b), f2, n2));
        if (cand) { unassign(S, cand); const left = L2.buses.map(id => S.busMap[id]).filter(Boolean); while (L2.freq > f2 && !planFits(S, ROUTES[L2.route], left, L2.freq, L2.freqN || 0)) L2.freq--; nb = cand; aiLog(S, co, `Remanejou um ônibus de ${lineRef(L2)} para cumprir o contrato de ${lineRef(L)}.`); break; }
      }

      if (!nb) nb = aiBuyFor(S, co, c.minCat, L, running);
      if (!nb) break; assignBusRaw(S, nb, L);
    }
  }
}
/** IA: compra para cumprir contrato (não depende da “vontade” de comprar). urgent: prefere usado, que chega em ~1 semana. */

function aiExpand(S, co) {

  // Pode licenciar um estado vizinho (exceto regional)
  if (!p.homeOnly && states.length < tier.maxStates + 1 && rnd(S) < 0.35) {
    const cand = Object.keys(UF).filter(u => !states.includes(u));
    const near = cand.filter(u => ROUTE_LIST.some(r => (CITY[r.a].uf === u && states.includes(CITY[r.b].uf)) || (CITY[r.b].uf === u && states.includes(CITY[r.a].uf))));
    if (near.length) { const u = pick(S, near); const c = licenseCost(S, co); if (co.cash > c + 1500000) { book(S, co, 'investimentos', c); co.states.push(u); states.push(u); aiLog(S, co, `Obteve autorização para operar em ${UF[u].name}.`); news(S, `${co.name} obteve autorização para operar em ${UF[u].name}.`, co.id); } }
  }
  const cat = pick(S, p.cats);
  const m = MODELS[aiChooseModel(S, co, cat)];
  let best = null;
  for (const r of ROUTE_LIST) {
    if (!states.includes(CITY[r.a].uf) || !states.includes(CITY[r.b].uf)) continue;
    if (S.lines.some(l => l.co === co.id && l.route === r.id)) continue;
    if (r.dist > 1400 && co.persona !== 'expansionista' && co.persona !== 'premium') continue;
    const pl = S.lines.find(l => l.co === 'P' && l.route === r.id);
    if (pl && (S.day < 365 || S.day - pl.opened < 240)) continue; // não invade linha nova do jogador
    const price = baseFare(S, r.dist) * CATS[cat].ref * p.priceMult;
    const freq = r.dist > 700 ? 1 : 2;
    const est = estimateLine(S, co.id, r.id, price, m.comfort, m.cap, freq);
    const h = tripHoursBase(r);
    const busesNeeded = Math.max(1, Math.ceil(freq * 2 / (h < 16 ? Math.max(1, Math.floor(14 / h)) : 24 / (h + turnaround(h)))));
    // gestão ruim superestima a demanda da linha nova (até ~25%) e aceita ocupação menor
    const opt = 1 + (1 - mgmtOf(co)) * 1.2 + (rnd(S) - 0.5) * 0.2 * (1.2 - mgmtOf(co));
    const pd = est.profitDay + Math.abs(est.revDay) * (opt - 1);

  for (let i = 0; i < best.busesNeeded; i++) { const b = aiBuyBus(S, co, cat); if (!b) break; assignBusRaw(S, b, L); got++; }
  if (!got) { closeLineRaw(S, L); return; }
  L.freq = best.freq; // ônibus ainda em entrega: a IA ajusta a frequência quando chegarem
  book(S, co, 'administrativas', 15000 * S.eco.ipca);
  aiLog(S, co, `Abriu a linha ${lineRef(best.r)}.`);
  news(S, `${co.name} abriu a linha ${lineRef(best.r)} (${CATS[cat].label}).`, co.id);
  const mineL = S.lines.find(l => l.co === 'P' && l.route === best.r.id);
  if (mineL) { const txt = `${co.name} entrou na sua rota ${placeName(best.r)} com ${CATS[cat].label.toLowerCase()} a R$ ${Math.round(best.price)} (a sua é R$ ${mineL.price}).`;
    S.notes.push({ k: 'slow', t: 'concorrencia', txt: 'Concorrência! ' + txt }); pushEvent(S, { kind: 'info', title: 'Novo concorrente na sua rota', text: txt + ' A linha dela ainda está ficando conhecida: você tem algumas semanas para reagir.' }); }
}

/** Mantém pelo menos cinco concorrentes ativos; novas empresas entram com capital próprio. */
function ensureCompetitors(S) {
  const active = S.cos.filter(c => !c.player && c.active).length;
  const chance = active < 5 ? 0.6 : (active < 8 ? 0.04 : 0);
  if (rnd(S) >= chance) return;
  const used = new Set(S.cos.map(c => c.name));
  const name = AI_NEW_NAMES.find(n => !used.has(n)); if (!name) return;
  const persona = pick(S, Object.keys(PERSONAS));
  const states = pick(S, [['SP'], ['RJ', 'MG'], ['PR', 'SC'], ['MG', 'ES'], ['GO', 'DF'], ['SP', 'PR'], ['BA', 'MG'], ['RS', 'SC']]);
  const colors = ['#22d3ee', '#e879f9', '#84cc16', '#f472b6', '#2dd4bf', '#fde047', '#c084fc', '#fb7185'];
  const co = spawnAI(S, { name, short: name.split(' ').slice(1).map(w => w[0]).join('').slice(0, 3).toUpperCase() || 'NOV', color: pick(S, colors), persona, states, cash: rr(S, 1800000, 3500000), fleet: ri(S, 4, 8), rep: 45 }, false);
  // A nova empresa paga pela frota inicial com seu próprio capital
  const fv = fleetValue(S, co); co.cash -= fv * 0.6; addLoan(S, co, 'onibus', fv * 0.4, loanRate(S, co, 'onibus'), 60, 'Financiamento de frota');
  co.cash -= fv * 0.4;
  co.lastValue = fv; co.led = {};
  news(S, `Novo concorrente: ${co.name} (${PERSONAS[persona].label}) começa a operar em ${states.map(u => UF[u].name).join(' e ')}.`, co.id, 'warn');
  pushEvent(S, { kind: 'info', title: 'Entrada de concorrente', text: `${co.name}, de perfil ${PERSONAS[persona].label.toLowerCase()}, começou a operar em ${states.map(u => UF[u].name).join(' e ')} com ${S.buses.filter(b => b.co === co.id).length} ônibus. Fique de olho nos preços das rotas onde ela entrar.` });
}

function news(S, txt, co, kind) { S.news.unshift({ day: S.day, txt, co: co || null, kind: kind || 'info' }); if (S.news.length > 150) S.news.length = 150; }
function pushEvent(S, ev) { ev.id = nid(S, 'ev'); ev.day = S.day; if (ev.choices) S.pending.push(ev); else { S.events.unshift(ev); if (S.events.length > 60) S.events.length = 60; } return ev; }

/** Sorteio diário de eventos empresariais (cerca de 1,3 por mês, sem repetição seguida). */
function rollEvents(S) {
  const P = S.cos[0];
  if (S.day - S.lastEventDay < 8 || rnd(S) > 0.055) return;
  const fleet = S.buses.filter(b => b.co === 'P').length;
  const staffN = S.emps.length;
  const opts = [
    ['diesel', 8], ['dieselDown', 6], ['economia', 6], ['fornecedor', 6], ['fretamento', 14], ['fretamentoLongo', fleet >= 4 ? 7 : 2],
    ['aquisicao', P.tier >= 2 ? 6 : 2], ['salarios', staffN >= 8 ? 6 : 0], ['fiscalizacao', 6], ['cidadeEvento', 9], ['credito', 4], ['obras', 5],
    ['linhaGoverno', 0]
  ];
  const tot = sum(opts, o => o[1]); let x = rnd(S) * tot, kind = opts[0][0];
  for (const o of opts) { x -= o[1]; if (x <= 0) { kind = o[0]; break; } }
  if (kind === S.lastEventKind) return;
  const ev = makeEvent(S, kind);
  if (ev) { S.lastEventDay = S.day; S.lastEventKind = kind; pushEvent(S, ev); }
}

function makeEvent(S, kind) {

  switch (kind) {
    case 'diesel': {
      const pct = rr(S, 0.07, 0.13);
      const lockCost = Math.round((20000 + fleet.length * 1800) * ip);
      S.eco.diesel *= 1 + pct;
      return { kind, title: 'Aumento do preço do diesel', text: `A Petrobras... perdão, a distribuidora nacional reajustou o diesel em ${round(pct * 100, 1)}%. O litro passa a ${fmt(S.eco.diesel).replace('R$ ', 'R$ ')}${''}. Combustível é seu maior custo variável.`.replace('A Petrobras... perdão, a distribuidora nacional', 'A distribuidora nacional'),
        choices: [
          { label: 'Pedir revisão de tarifa ao governo', desc: 'As tarifas são reguladas: o governo analisa e pode conceder +3% a 5% nas suas linhas — ou negar.', act: 'revAll' },
          { label: 'Absorver o custo', desc: 'Mantém os preços e a competitividade. A margem cai.', act: 'none' },

    case 'economia': {

    }
    case 'fornecedor':
      return { kind, title: 'Problema com fornecedor de peças', text: 'Seu principal fornecedor de peças está com atrasos por 30 dias. Como reagir?',
        choices: [
          { label: 'Aceitar os atrasos', desc: 'Serviços na garagem levam 60% mais tempo por 30 dias.', act: 'mod', mod: { type: 'partsDelay', v: 1.6, days: 30 } },
          { label: 'Comprar de fornecedor alternativo', desc: 'Prazos normais, mas peças 35% mais caras por 30 dias.', act: 'mod', mod: { type: 'partsCost', v: 1.35, days: 30 } }
        ] };
    case 'fretamento': case 'fretamentoLongo': {
      const longo = kind === 'fretamentoLongo';
      const clients = longo ? ['Indústria de alimentos (transporte de funcionários)', 'Mineradora (turnos)', 'Usina de açúcar (safra)', 'Construtora (canteiro de obras)'] : ['Excursão de igreja', 'Time de futebol amador', 'Agência de turismo', 'Formatura universitária', 'Congresso médico', 'Romaria a Aparecida'];
      const n = longo ? ri(S, 2, Math.max(2, Math.min(5, Math.ceil(fleet.length / 3)))) : ri(S, 1, 2);
      const days = longo ? ri(S, 30, 120) : ri(S, 2, 5);
      const km = longo ? ri(S, 120, 220) : ri(S, 250, 600);
      const perDay = Math.round((longo ? rr(S, 1300, 1900) : rr(S, 2400, 3400)) * ip / 10) * 10;
      return { kind: 'contrato', title: longo ? 'Proposta de contrato especial' : 'Proposta de fretamento', text: `${pick(S, clients)} quer ${n} ônibus por ${days} dias, rodando ~${km} km/dia cada. Pagamento: ${fmt(perDay)} por ônibus/dia (total ${fmt(perDay * n * days)}). Combustível e motoristas por sua conta. Você escolhe quais ônibus vão: da reserva ou tirados de linhas (eles voltam para a linha no fim do contrato).`,
        offer: { n, days, km, perDay, client: 'Fretamento' }, expires: S.day + 7,
        choices: [{ label: 'Aceitar o contrato', desc: `Escolha ${n} ônibus abaixo.`, act: 'charter' }, { label: 'Recusar', act: 'none' }] };
    }
    case 'aquisicao': {
      const sizes = ri(S, 2, 4);
      const cands = ROUTE_LIST.filter(r => P.states.includes(CITY[r.a].uf) && P.states.includes(CITY[r.b].uf) && r.dist < 700 && !S.lines.some(l => l.co === 'P' && l.route === r.id));
      if (!cands.length) return null;
      const r = pick(S, cands.sort((a, b) => b.base - a.base).slice(0, 12));
      const buses = []; for (let i = 0; i < sizes; i++) buses.push(randomUsed(S, null, ['conv', 'exec'], 5, 15));
      const val = sum(buses, u => busValue(S, { model: u.model, year: u.year, cond: u.cond, km: u.km }));
      const price = Math.round(val * rr(S, 0.78, 1.0) / 1000) * 1000;
      const drivers = sizes * 2;
      const name = 'Viação ' + pick(S, ['Santa Luzia', 'Boa Esperança', 'São Cristóvão', 'Nova Aliança', 'Estrela do Vale']);
      openAuction(S, { kind: 'familia', name, buses, route: r.id, drivers, labor: Math.round(drivers * marketSalary(S, 'motorista') * ENCARGOS * rr(S, 0, 1.5)), val, min: Math.round(val * rr(S, 0.85, 0.95) / 1000) * 1000, start: Math.round(val * 0.7 / 1000) * 1000 });
      return null;
    }
    case 'salarios': {
      const pct = rr(S, 0.05, 0.09);
      return { kind, title: 'Negociação salarial', text: `O sindicato pede reajuste de ${round(pct * 100, 1)}% para todos os funcionários. Sua folha atual é de ${fmt(staffInfo(S, P).payroll)} por mês (com encargos).`,
        choices: [
          { label: `Conceder ${round(pct * 100, 1)}%`, desc: 'Satisfação sobe bastante.', act: 'raise', v: pct, sat: 12 },
          { label: `Contraproposta de ${round(pct * 50, 1)}%`, desc: 'Metade do pedido. Satisfação estável, pequeno risco de paralisação.', act: 'raise', v: pct / 2, sat: 2, strike: 0.25 },
          { label: 'Recusar', desc: 'Sem custo agora; satisfação cai e há risco de paralisação.', act: 'raise', v: 0, sat: -12, strike: 0.55 }
        ] };
    }
    case 'fiscalizacao': {
      const avg = fleet.length ? sum(fleet, b => b.cond) / fleet.length : 80;
      if (avg < 55) { const fine = Math.round((15000 + fleet.filter(b => b.cond < 50).length * 6000) * ip); book(S, P, 'ocorrencias', fine); P.rep = Math.max(1, P.rep - 2); return { kind: 'info', title: 'Fiscalização da agência reguladora', text: `Fiscais encontraram ônibus em mau estado (condição média ${Math.round(avg)}%). Multa de ${fmt(fine)} e queda de reputação.` }; }
      P.rep = Math.min(99, P.rep + 1); return { kind: 'info', title: 'Fiscalização da agência reguladora', text: `Fiscalização sem irregularidades (condição média da frota ${Math.round(avg)}%). Pequeno ganho de reputação.` };
    }
    case 'cidadeEvento': {
      const c = pick(S, CITIES.filter(x => x.pop > 700)); const d = ri(S, 3, 6); const v = rr(S, 1.3, 1.7);
      S.mods.push({ type: 'cityDemand', city: c.id, v, until: S.day + d + 7, from: S.day + 7 });
      return { kind: 'info', title: `Grande evento em ${c.name}`, text: `${pick(S, ['Um festival de música', 'Uma feira agropecuária', 'Um congresso nacional', 'Um campeonato esportivo', 'Uma festa religiosa'])} acontece em ${c.name} a partir de ${fmtDate(S.day + 7)}. A demanda das rotas para a cidade deve subir cerca de ${Math.round((v - 1) * 100)}% por alguns dias. Vale reforçar frequências ou ajustar preços.` };
    }
    case 'credito':
      S.mods.push({ type: 'fleetCredit', v: 0.99, until: S.day + 60 });
      return { kind: 'info', title: 'Programa de renovação de frota', text: 'O banco de fomento abriu uma linha subsidiada: por 60 dias, financiamentos de ônibus têm juros 0,3 p.p. menores ao mês.' };
    case 'linhaGoverno': {
      const r = obligationRoute(S, P); if (!r) return null;
      const o = obligationOffer(S, P, r), ca = CITY[r.a].name, cb = CITY[r.b].name;
      return { kind, title: 'Pedido do governo: linha obrigatória', text: `A agência reguladora quer que você opere a linha ${ca} – ${cb} (${Math.round(r.dist)} km, ~${Math.round(r.base)} passageiros/dia por sentido) por ${o.months} meses, com no mínimo ${o.minF} saída por sentido todo dia.${o.rough ? ' A estrada é ruim: os ônibus se desgastam ~35% mais.' : ''} A estimativa é de ${o.est >= 0 ? 'lucro pequeno' : 'prejuízo de ~' + fmt(-o.est * 30.4) + '/mês'}; o governo paga subsídio de ${fmt(o.sub)}/mês se a frequência for cumprida. Encerrar antes do prazo: multa de ${fmt(80000 * ip)}.`,
        offer: o, expires: S.day + 10,
        choices: [{ label: 'Aceitar', desc: 'Reputação +2 e boa relação com o governo. A linha começa em 10–15 dias: aloque ônibus.', act: 'obrig' }, { label: 'Recusar', desc: 'Reputação −3.', act: 'obrigNo' }] };
    }
    case 'obras': {
      const mine = S.lines.filter(l => l.co === 'P');
      const r = mine.length ? ROUTES[pick(S, mine).route] : pick(S, ROUTE_LIST);
      S.mods.push({ type: 'slowRoute', route: r.id, v: 1.18, until: S.day + 30 });
      return { kind: 'info', title: 'Obras na rodovia', text: `Obras de duplicação na rota ${placeName(r)}: viagens 18% mais lentas por 30 dias. Isso reduz a quantidade de viagens possíveis por ônibus.` };
    }
  }
  return null;
}

/** Resolve uma escolha de evento pendente. */
function resolveEvent(S, evId, idx, opts) {
  const ev = S.pending.find(e => e.id === evId); if (!ev) return { ok: false };
  const ch = ev.choices[idx], P = S.cos[0];
  let msg = '';
  if (ch.act === 'revAll') { const ok2 = rnd(S) < 0.5, up = rr(S, 0.03, 0.05); S.lines.filter(l => l.co === 'P').forEach(l => { if (l.conc) { if (ok2) { l.conc.base = Math.round(l.conc.base * (1 + up)); l.price = concFare(S, l); } l.conc.lastRev = S.day; } else if (ok2) l.price = Math.round(l.price * (1 + up)); }); msg = ok2 ? `Revisão aprovada: tarifas +${round(up * 100, 1)}%.` : 'O governo negou a revisão. Novo pedido de revisão só daqui a 1 ano.'; }
  else if (ch.act === 'emerg' || ch.act === 'emergNo') { const L = S.lines.find(l => l.id === ev.line);
    if (L && L.conc) { if (ch.act === 'emergNo') { L.conc.end -= 365; L.conc.leave = true; msg = `Você sai de ${lineRef(L)} em ${fmtDate(L.conc.end)}, sem multa.`; regAdj(S, P0(S), -3, `recusou o contrato emergencial de ${lineRef(L)}`); }
      else { const c = L.conc; c.minF = 1; c.minCat = 'conv'; c.nightMin = 0; const loss = Math.max(0, -(L.last ? L.last.profit : 0)); c.sub = Math.round(clamp(loss * 0.7 + 10000, 12000, 70000) * S.eco.ipca / 1000) * 1000; c.emerg = true; c.perf = { trips: 0, late: 0, cancel: 0 }; regAdj(S, P0(S), 3, `aceitou o contrato emergencial de ${lineRef(L)}`); msg = `Contrato emergencial de ${lineRef(L)}: mínimo 1×, convencional, subsídio de ${fmtMoney(c.sub)}/mês até ${fmtDate(c.end)}.`; } } }
  else if (ch.act === 'priceAll') { S.lines.filter(l => l.co === 'P').forEach(l => l.price = Math.round(l.price * ch.v)); msg = 'Tarifas reajustadas em 5%.'; }
  else if (ch.act === 'fuelLock') { if (P.cash < ch.cost) return { ok: false, msg: 'Caixa insuficiente.' }; book(S, P, 'administrativas', ch.cost); P.fuelLock = { price: ch.price, until: S.day + 180 }; msg = 'Preço do diesel travado por 6 meses.'; }
  else if (ch.act === 'mod') { S.mods.push({ type: ch.mod.type, v: ch.mod.v, until: S.day + ch.mod.days }); msg = 'Decisão registrada.'; }
  else if (ch.act === 'charter') {
    const o = ev.offer;
    const ok = b => b && b.co === 'P' && b.status === 'ativo' && !b.charter;
    let chosen = (opts && opts.buses || []).map(id => S.buses.find(b => b.id === id)).filter(ok);
    if (!chosen.length) chosen = charterCandidates(S).slice(0, o.n).map(x => x.b);
    if (chosen.length < o.n) return { ok: false, msg: `Escolha ${o.n} ônibus para o contrato (escolhidos: ${chosen.length}).` };
    chosen = chosen.slice(0, o.n);
    for (const b of chosen) {
      const back = b.line, L = back ? S.lines.find(l => l.id === back) : null;
      if (b.subFor) { const orig = S.buses.find(x => x.id === b.subFor); if (orig) orig.subBy = null; b.subFor = null; }
      if (L) { unassign(S, b); replanLine(S, L); }
      b.charter = { until: S.day + o.days, km: o.km, per: o.perDay, back: back && !b.subFor ? back : null, client: ev.offer.client };
      if (onRoad(S, b)) b.charterNext = true; else b.status = 'fretamento';
    }
    msg = `Contrato aceito: ${chosen.map(b => 'carro ' + b.prefix).join(', ')} em fretamento por ${o.days} dias.` + (chosen.some(b => b.charter.back) ? ' Os que saíram de linhas voltam para elas ao fim do contrato.' : '') + (chosen.some(b => b.charterNext) ? ' Quem está na estrada entra no contrato ao chegar.' : '');
  } else if (ch.act === 'acquire') {
    const o = ev.offer, r = ROUTES[o.route];
    if (!P.states.includes(CITY[r.a].uf) || !P.states.includes(CITY[r.b].uf)) return { ok: false, msg: 'Sem autorização nos estados da linha.' };
    const pay = ch.pay === 'cash' ? o.price : o.price * 0.4;
    if (P.cash < pay) return { ok: false, msg: 'Caixa insuficiente.' };
    book(S, P, 'investimentos', o.price);
    if (ch.pay === 'loan') addLoan(S, P, 'onibus', o.price * 0.6, loanRate(S, P, 'onibus') + 0.002, 48, 'Financiamento da aquisição');
    let L = S.lines.find(l => l.co === 'P' && l.route === o.route);
    if (!L) { // a empresa comprada tinha a concessão da linha: o contrato vem junto, com o prazo que restava
      L = makeLine(S, 'P', o.route, baseFare(S, r.dist), 1);
      setConcession(S, L, { start: S.day, minF: 1, minCat: 'conv', ceil: Math.round(suggestedPrice(S, o.route, 'conv') * 1.1), disc: 0, maxAge: 15 });
      L.conc.end = S.day + ri(S, 365, 730); L.opened = S.day - 200;
    }
    o.buses.forEach(u => assignBusRaw(S, makeBus(S, 'P', u.model, u.year, u.km, u.cond), L));
    L.freq = Math.max(1, Math.floor(planCapacity(S, L, L.buses) / 2));
    for (let i = 0; i < o.drivers; i++) S.emps.push(makeEmp(S, 'motorista', 40 + rnd(S) * 25));
    news(S, `${P.name} adquiriu uma empresa menor: +${o.buses.length} ônibus e a linha ${lineRef(r)}.`, 'P', 'good');
    msg = 'Aquisição concluída.';
  } else if (ch.act === 'buyBankrupt') {
    const o = ev.offer; const seller = S.cos.find(c => c.id === o.co);
    if (P.cash < o.price) return { ok: false, msg: 'Caixa insuficiente.' };
    book(S, P, 'investimentos', o.price);
    transferAssets(S, seller, P, true);
    news(S, `${P.name} comprou os ativos de ${seller.name}.`, 'P', 'good');
    msg = 'Ativos incorporados. Verifique as linhas: algumas podem exigir autorização estadual para operar.';
  } else if (ch.act === 'raise') {
    if (ch.v) S.emps.forEach(e => e.salary = Math.round(e.salary * (1 + ch.v)));
    S.emps.forEach(e => e.sat = clamp(e.sat + ch.sat, 0, 100));
    if (ch.strike && rnd(S) < ch.strike) { S.mods.push({ type: 'strike', v: 0.5, until: S.day + 2 }); msg = 'Os motoristas fizeram dois dias de paralisação parcial.'; }
    else msg = 'Negociação encerrada.';
  } else if (ch.act === 'obrig') { const L = acceptObligation(S, P, ev.offer); msg = `Linha ${placeName(L)} criada com compromisso até ${fmtDate(L.obrig.until)}. Começa em ${fmtDate(L.opened)}: aloque ônibus.`;
  } else if (ch.act === 'obrigNo') { P.rep = Math.max(1, P.rep - 3); msg = 'Pedido recusado. A agência não gostou.';
  } else if (ch.act === 'comp26') {
    const P = S.cos[0], v = Math.round(2 * 120000 * S.eco.ipca); book(S, P, 'outras', v); P.rep = Math.min(100, P.rep + 16);
    msg = `Devolvidos ${fmtMoney(v)} e +16 de reputação.`; news(S, msg, 'P', 'good');
  } else if (ch.act === 'aucBid' || ch.act === 'aucPass' || ch.act === 'aucWatch') {
    const a = (S.auctions || []).find(x => x.id === ev.auc);
    if (!a || a.done) msg = 'O leilão já foi encerrado.';
    else if (ch.act === 'aucBid') { const r = A.aucBid(S, a.id, ch.v); if (!r.ok) return r; msg = r.msg; }
    else if (ch.act === 'aucPass') { if (!a.out.includes('P')) a.out.push('P'); msg = 'Você saiu do leilão.'; }
    else msg = 'Você acompanha o leilão pela tela inicial.';
  } else if (ch.act === 'declineBankrupt') { liquidate(S, S.cos.find(c => c.id === ev.offer.co)); msg = 'Ativos foram vendidos a terceiros.'; }
  else msg = 'Ok.';
  S.pending.splice(S.pending.indexOf(ev), 1);
  ev.result = ch.label + ' — ' + msg; S.events.unshift(ev);
  return { ok: true, msg };
}

/** Ônibus que podem ir para um fretamento: reserva primeiro, depois os de linha (com o impacto). */
function charterCandidates(S) {
  return S.buses.filter(b => b.co === 'P' && b.status === 'ativo' && !b.charter).map(b => {
    const L = b.line ? S.lines.find(l => l.id === b.line) : null;
    let impact = null;
    if (L) { const rest = L.buses.filter(id => id !== b.id && (S.buses.find(x => x.id === id) || {}).status === 'ativo'); const cap = rest.length ? Math.floor(planCapacity(S, L, rest) / 2) : 0; impact = { L, cap, freq: L.freq }; }
    return { b, L, impact, road: onRoad(S, b) };
  }).sort((x, y) => (!!x.L - !!y.L) || ((x.impact ? x.impact.freq - x.impact.cap : 0) - (y.impact ? y.impact.freq - y.impact.cap : 0)));
}
/** Fretamentos: receita e custo diários; liberação ao final. */
function dailyCharters(S, co) {
  for (const b of S.buses) {
    if (b.co !== co.id || b.status !== 'fretamento' || !b.charter) continue;
    const c = b.charter, m = MODELS[b.model];
    book(S, co, 'contratos', c.per);
    book(S, co, 'impostos', c.per * 0.08);
    book(S, co, 'combustivel', c.km / m.kmpl * dieselFor(S, co));
    book(S, co, 'manutencao', c.km * m.maint * 0.6 * S.eco.ipca);
    bc(b, 'rec', c.per); bc(b, 'imp', c.per * 0.08); bc(b, 'km', c.km); bc(b, 'diesel', c.km / m.kmpl * dieselFor(S, co)); bc(b, 'manut', c.km * m.maint * 0.6 * S.eco.ipca);
    b.km += c.km; b.kmSince += c.km; b.cond = Math.max(5, b.cond - c.km * 0.00028); b.clean = Math.max(0, b.clean - 10);
    if (S.day >= c.until) {
      b.status = 'ativo'; const back = c.back ? S.lines.find(l => l.id === c.back) : null; b.charter = null;
      if (back && b.co === back.co) { assignBusRaw(S, b, back); b.t = S.day + 1 + 4.5 / 24; }
      if (co.player) { const txt = `Fretamento do carro ${b.prefix} encerrado; ${back ? `ele volta para ${lineRef(back)} amanhã.` : 'ônibus disponível na reserva.'}`; news(S, txt, 'P'); S.notes.push({ k: 'info', txt }); }
    }
  }
}

function transferAssets(S, from, to, inclLines) {
  if (from.closed && !from.closed.to) { from.closed.to = to.id; mktLog(S, to.id, `Comprou a massa falida de ${from.name}.`, 'aquisicao'); }
  for (const L of S.lines.filter(l => l.co === from.id)) {
    const exists = S.lines.find(l => l.co === to.id && l.route === L.route);
    if (exists || !inclLines) { L.buses.slice().forEach(id => { const b = S.buses.find(x => x.id === id); unassign(S, b); }); S.lines.splice(S.lines.indexOf(L), 1); continue; }
    L.co = to.id;
    if (to.player && L.conc) startTransition(S, L);
  }
  for (const b of S.buses.filter(x => x.co === from.id)) { b.co = to.id; if (b.status === 'manut') b.status = 'ativo'; b.prefix = (to.nextPrefix = (to.nextPrefix || 1000) + 1); }
  from.garage.jobs = [];
  if (to.player) { const n = from.aiStaff ? Math.round(from.aiStaff.motorista * 0.6) : 0; for (let i = 0; i < n; i++) S.emps.push(makeEmp(S, 'motorista', 40 + rnd(S) * 25)); }
  to.lastValue = fleetValue(S, to);
}
function liquidate(S, co) {
  if (!co) return;
  if (co.closed && !co.closed.to) { co.closed.to = 'leilao'; mktLog(S, co.id, `Os ônibus de ${co.name} foram leiloados (sem comprador para a empresa).`, 'falencia'); }
  for (const L of S.lines.filter(l => l.co === co.id)) closeLineRaw(S, L);
  for (const b of S.buses.filter(x => x.co === co.id)) { removeBus(S, b); if (busAge(S, b) < 18 && S.used.length < 30) S.used.push(usedListing(S, b)); }
}
function offerAcquisitionOfBankrupt(S, co) {
  if (S.buses.some(b => b.co === co.id)) {
    const val = fleetValue(S, co), drv = co.aiStaff ? Math.round(co.aiStaff.motorista * 0.6) : 4;
    openAuction(S, { kind: 'falida', name: co.name, co: co.id, drivers: drv, labor: Math.round(drv * marketSalary(S, 'motorista') * ENCARGOS * rr(S, 3, 6)), val, min: 0, start: Math.round(val * 0.5 / 1000) * 1000 });
    return;
  }
  liquidate(S, co);
}
function offerAcquisitionOld(S, co) {
  const P = S.cos[0];
  const val = fleetValue(S, co), nl = S.lines.filter(l => l.co === co.id).length;
  const price = Math.round(val * 0.7 / 1000) * 1000;
  if (P.active && P.tier >= 2 && P.cash > price * 0.5) {
    pushEvent(S, { kind: 'aquisicao', title: `Massa falida de ${co.name}`, text: `${co.name} faliu. O administrador judicial oferece toda a frota (${S.buses.filter(b => b.co === co.id).length} ônibus, avaliados em R$ ${Math.round(val).toLocaleString('pt-BR')}) e ${nl} linha(s) por R$ ${price.toLocaleString('pt-BR')}.`,
      offer: { co: co.id, price }, expires: S.day + 10,
      choices: [{ label: `Comprar (R$ ${price.toLocaleString('pt-BR')})`, act: 'buyBankrupt' }, { label: 'Recusar', act: 'declineBankrupt' }] });
    return;
  }
  // Outra empresa com caixa compra; senão, liquida
  const buyer = S.cos.filter(c => !c.player && c.active && c.cash > price * 1.5).sort((a, b) => b.cash - a.cash)[0];
  if (buyer) { book(S, buyer, 'investimentos', price); transferAssets(S, co, buyer, true); news(S, `${buyer.name} comprou os ativos de ${co.name}.`, buyer.id); }
  else liquidate(S, co);
}

/* =====================================================================
 * LEILÕES — venda de empresa da família (com preço mínimo) e massa falida (leilão judicial).
 * Lances abertos, rodada a rodada (a cada 2 dias). Quem for superado decide se cobre ou desiste.
 * Sem lance novo numa rodada, o maior lance leva. Quem vence assume os motoristas e a dívida trabalhista.
 * As linhas vêm com o contrato de concessão que restava; só passam para quem tem licença no estado.
 * ===================================================================== */
const AUC_ROUND = 2;
function aucLines(S, a) { return a.kind === 'falida' ? S.lines.filter(l => l.co === a.co) : [{ route: a.route }]; }
function aucFleetVal(S, a) { return a.kind === 'falida' ? fleetValue(S, S.cos.find(c => c.id === a.co)) : a.val; }
function aucNBus(S, a) { return a.kind === 'falida' ? S.buses.filter(b => b.co === a.co).length : a.buses.length; }
function openAuction(S, o) {
  const a = { id: nid(S, 'au'), day: S.day, round: 0, next: S.day + AUC_ROUND, bids: [], lead: null, cur: 0, out: [], done: false, ...o };
  a.step = Math.max(10000, Math.round(a.val * 0.05 / 1000) * 1000);

    choices: [{ label: `Dar o lance inicial (${fmtMoney(a.start)})`, act: 'aucBid', v: a.start }, { label: 'Só acompanhar', desc: 'Você pode entrar depois pela tela inicial.', act: 'aucWatch' }, { label: 'Não tenho interesse', act: 'aucPass' }] });

}
/** Registra um lance (jogador ou IA). */
function aucPlace(S, a, coId, v) { a.cur = v; a.lead = coId; a.bids.push({ co: coId, v, day: S.day }); a.quiet = 0; }
/** Rodada: as empresas da IA que ainda acham que vale cobrem o lance; sem lance novo, encerra. */
function auctionDay(S) {

    a.round++; a.next = S.day + AUC_ROUND;
    const need = a.lead ? a.cur + a.step : a.start;
    const want = Object.entries(a.ai).filter(([id, mx]) => id !== a.lead && mx >= need && !a.out.includes(id) && S.cos.find(c => c.id === id && c.active && c.cash > need * 0.4));
    if (want.length) {
      want.sort((x, y) => y[1] - x[1] + gauss(S) * a.step);
      const [id] = want[0]; aucPlace(S, a, id, need);
      want.slice(1).forEach(([id2, mx]) => { if (mx < need + a.step) a.out.push(id2); });
      const P = S.cos[0], c = S.cos.find(x => x.id === id);

        pushEvent(S, { kind: 'leilao', title: `Leilão ${a.name}: você foi superado`, text: `${c.name} deu ${fmtMoney(need)} (rodada ${a.round}). Frota avaliada em ${fmtMoney(aucFleetVal(S, a))}; você assume ${fmtMoney(a.labor)} de dívida trabalhista se vencer.`, auc: a.id,
          choices: [{ label: `Cobrir: ${fmtMoney(need + a.step)}`, act: 'aucBid', v: need + a.step }, { label: `Cobrir forte: ${fmtMoney(need + 3 * a.step)}`, desc: 'Mostra disposição e pode tirar concorrentes.', act: 'aucBid', v: need + 3 * a.step }, { label: 'Desistir', act: 'aucPass' }] });

function closeAuction(S, a) {

  // Quem vence paga; se o jogador não tiver como pagar, perde o lote (multa) e passa para o próximo lance

  for (const b of order) {
    if (a.min && b.v < a.min) break; // família não vende abaixo do mínimo
    const co = S.cos.find(c => c.id === b.co); if (!co || !co.active) continue;

      book(S, P, 'investimentos', b.v);
      if (down < b.v) addLoan(S, P, 'onibus', b.v - down, loanRate(S, P, 'onibus') + 0.002, 48, 'Financiamento da aquisição');
    } else book(S, co, 'investimentos', b.v);
    aucDeliver(S, a, co);
    a.winner = co.id; a.price = b.v;
    mktLog(S, co.id, `Venceu o leilão ${a.name} por ${fmtMoney(b.v)}.`, 'aquisicao');
    const t = co.player ? `Você venceu o leilão ${a.name} por ${fmtMoney(b.v)}${P.cash < 0 ? '' : ''}. Chegaram ${a.what.replace(' com o contrato que resta', '')}.${a.labor ? ` Dívida trabalhista de ${fmtMoney(a.labor)} em 12 parcelas.` : ''}${a.skipped ? ` Sem licença em ${a.skipped}: essas linhas ficaram com o governo (os ônibus vieram).` : ''}`
      : `${co.name} venceu o leilão ${a.name} por ${fmtMoney(b.v)}.`;
    news(S, t, co.player ? 'P' : co.id, co.player ? 'good' : null);
    if (P.active && a.bids.some(x => x.co === 'P')) pushEvent(S, { kind: 'info', title: co.player ? 'Leilão vencido!' : 'Resultado do leilão', text: t });
    return;
  }
  // Ninguém levou
  a.winner = null;
  if (a.kind === 'falida') { liquidate(S, S.cos.find(c => c.id === a.co)); news(S, `Leilão de ${a.name} sem comprador: os ônibus foram vendidos um a um no mercado de usados.`, null); }
  else news(S, `A família da ${a.name} não aceitou os lances e desistiu da venda.`, null);
  if (P.active && a.bids.some(x => x.co === 'P')) pushEvent(S, { kind: 'info', title: 'Leilão sem venda', text: a.kind === 'falida' ? 'Ninguém deu lance suficiente: os ônibus foram para o mercado de usados.' : `Nenhum lance chegou ao preço mínimo da família (o maior foi ${fmtMoney(a.cur)}).` });
}
/** Entrega o lote ao vencedor: ônibus, linhas (se tiver licença), motoristas e dívida trabalhista. */
function aucDeliver(S, a, co) {
  if (a.kind === 'falida') {
    const from = S.cos.find(c => c.id === a.co);
    const no = S.lines.filter(l => l.co === from.id && !hasLicense(co, ROUTES[l.route]));
    if (no.length) a.skipped = [...new Set(no.flatMap(l => routeUFs(ROUTES[l.route])).filter(u => !co.states.includes(u)))].join(', ');
    no.forEach(L => { L.buses.slice().forEach(id => unassign(S, S.buses.find(b => b.id === id))); closeLineRaw(S, L); });
    transferAssets(S, from, co, true);
  } else {
    const r = ROUTES[a.route];

    if (L) L.freq = Math.max(1, Math.floor(planCapacity(S, L, L.buses) / 2));

  }
  if (a.labor > 0) co.loans.push({ id: nid(S, 'f'), kind: 'trabalhista', label: 'Dívida trabalhista (aquisição)', principal: a.labor, bal: a.labor, rate: 0, months: 12, left: 12, pay: Math.round(a.labor / 12), bus: null, start: S.day }); // passivo assumido (sem entrada de caixa)
}

function usedListing(S, b) { const l = { id: nid(S, 'u'), model: b.model, year: b.year, km: Math.round(b.km), cond: Math.round(b.cond), seller: b.co ? (S.cos.find(c => c.id === b.co) || {}).name : 'Revenda' }; l.price = Math.round(busValue(S, l) * 1.15 / 1000) * 1000; return l; }

/** Meia-noite: fecha o dia, sorteia eventos, vira o dia (e o mês) e planeja o novo dia. */
function endDay(S) {
  const P = S.cos[0];
  endDayOps(S);
  processOrders(S); concessionDay(S); concessionEndDay(S); extDay(S); auctionDay(S); // lançamentos no fim do dia (fecham no mês certo)
  S.daily.push({ day: S.day, cash: Math.round(P.cash), rec: Math.round((P.ledDay.passagens || 0) + (P.ledDay.servicos || 0) + (P.ledDay.contratos || 0)),
    pax: P.today ? P.today.pax : 0, occ: P.today && P.today.seats ? round(P.today.pax / P.today.seats, 3) : 0, trips: P.today ? P.today.trips : 0, canc: P.today ? P.today.cancel : 0,
    led: P.ledDay, short: !!P._driverShort });
  if (S.daily.length > 90) S.daily.shift();
  if (S.notes.length > 30) S.notes.splice(0, S.notes.length - 30);
  rollEvents(S);
  S.pending = S.pending.filter(e => { if (e.expires && e.expires < S.day) { if (e.choices.some(c => c.act === 'declineBankrupt')) liquidate(S, S.cos.find(c => c.id === e.offer.co)); e.result = 'Proposta expirou.'; S.events.unshift(e); return false; } return true; });
  S.day++;
  const cal = dateOf(S.day);
  if (cal.dow === 1) {
    for (const co of S.cos) if (co.active && !co.player) aiPricing(S, co);
    aiReact(S);
    // Relatório semanal (segunda a domingo)
    const days = S.daily.slice(-7);
    const led = {}; days.forEach(d => Object.entries(d.led).forEach(([k, v]) => led[k] = (led[k] || 0) + v));
    S.weekly.unshift({ kind: 'periodo', from: days[0].day, to: S.day - 1, days: days.length, cashDelta: days.length ? Math.round(P.cash - (S.daily[S.daily.length - days.length - 1] || { cash: days[0].cash }).cash) : 0,
      pax: sum(days, d => d.pax), trips: sum(days, d => d.trips), canc: sum(days, d => d.canc), rec: sum(days, d => d.rec),
      occ: sum(days, d => d.occ * d.trips) / Math.max(1, sum(days, d => d.trips)), short: days.some(d => d.short), led, sum: ledSummary(led) });
    if (S.weekly.length > 20) S.weekly.length = 20;
  }

  if (!S.over) startDay(S);
}

/** Avança o relógio até tEnd (dias fracionários), processando partidas, chegadas
 *  e viradas de dia em ordem. Para se surgir decisão pendente ou falência. */
function tick(S, tEnd) {
  if (S.over) return { stopped: true };
  if (S.pending.length) return { stopped: true, blocked: true };
  if (!S.plan) startDay(S);
  for (let guard = 0; guard < 200000; guard++) {
    const dep = S.plan.length ? S.plan[0].start : Infinity;
    const arr = S.onRoad.length ? S.onRoad[0].arr : Infinity;
    const mid = S.day + 1;
    const ne = Math.min(dep, arr);
    if (ne < mid && ne <= tEnd) {
      S.t = Math.max(S.t, ne);
      if (dep <= arr) departTrip(S, S.plan.shift()); else arriveTrip(S, S.onRoad.shift());
      const neg = S.cos[0].cash < 0;
      if (neg && !S._neg) S.notes.push({ k: 'slow', t: 'caixa', txt: 'Seu caixa ficou negativo!' });
      S._neg = neg;
      continue;
    }
    if (mid <= tEnd) {
      S.t = mid; endDay(S);
      if (S.over || S.pending.length) return { stopped: true };
      continue;
    }
    S.t = Math.max(S.t, tEnd);
    return { stopped: false };
  }
  return { stopped: false };
}
/** Avança n dias inteiros (usado em testes). */
function advance(S, n) {
  const start = S.day, startCash = S.cos[0].cash;
  const r = tick(S, Math.floor(S.t + 1e-9) + n);
  return { stopped: r.stopped, rep: { days: S.day - start, cashDelta: Math.round(S.cos[0].cash - startCash) } };
}

const P0 = S => S.cos[0];
const ok = (msg, x) => ({ ok: true, msg, ...x });
const fail = msg => ({ ok: false, msg });
function onRoad(S, b) { return (S.onRoad || []).some(x => x.bus === b.id); }
/** Equipe mudou no meio do dia: atualiza o cache e, se agora há motoristas

function staffChanged(S) {
  const P = S.cos[0];

  if (!P._driverShort) return 0;
  const info = staffInfo(S, P);
  if (info.driverHours * (P.policy.overtime !== false ? 1.15 : 1) + 0.01 < (P._driverUse || 0)) return 0;
  P._driverShort = false;
  const before = (S.plan || []).filter(t => t.co === 'P').length;

/** Sugestão de manutenção para um ônibus (ou null). pri: quanto maior, mais urgente. */
function maintSuggestion(S, b) {

  const co = S.cos.find(c => c.id === b.co) || S.cos[0], age = busAge(S, b), mx = maxCond(S, b);
  const prevKm = (co.policy && co.policy.prevKm) || 25000;
  if (age >= 18 && b.cond < 55) return { t: 'vender', pri: 5, txt: `Velho (${age} anos) e gasto: considere vender` };
  if (b.cond < 50 && mx - b.cond > 12) return { t: 'revisao', pri: 4, txt: `Revisão geral: sobe até ${Math.round(mx)}%` };
  if (age >= 9 && mx < 80 && !b.renov) return { t: 'renovacao', pri: 3, txt: `Renovação: teto de condição está em ${Math.round(mx)}%` };
  if (b.kmSince >= prevKm * 0.9) return { t: 'preventiva', pri: 2, txt: 'Preventiva vencendo' };
  if (b.clean < 40) return { t: 'limpeza', pri: 1, txt: 'Precisa de limpeza' };

/** Venda de um ônibus: valor de revenda, financiamento vinculado a quitar e o que sobra. */
function saleQuote(S, b) {
  const co = S.cos.find(c => c.id === b.co) || S.cos[0];
  const v = Math.round(busValue(S, b) * 0.9), loans = co.loans.filter(l => l.bus === b.id);

/** Custo mensal estimado de operação (sem motorista e bordo, que não dependem do ônibus) rodando kmMonth. */
function estBusMonth(S, spec, kmMonth) {
  const m = MODELS[spec.model], age = Math.max(0, curYear(S) - spec.year), cond = spec.cond;
  const kmpl = m.kmpl * (0.86 + 0.14 * cond / 100) * (1 - age * 0.004);
  const diesel = kmMonth / kmpl * S.eco.diesel;
  const manut = kmMonth * m.maint * 0.7 * S.eco.ipca * (1 + age * 0.04);
  const rate = (1 / 600000) * Math.pow((100 - cond) / 20 + 1, 2) * (1 + age / 10) / m.rel;
  const corr = rate * kmMonth * (modelPrice(S, spec.model) * JOBS.corretiva.cost * (1 + age * 0.045) * 1.2 + 4000 * S.eco.ipca);
  const seguro = 0.0024 * busValue(S, spec) + 1100 * S.eco.ipca;
  const prev = kmMonth / 20000 * modelPrice(S, spec.model) * JOBS.preventiva.cost * (1 + age * 0.045);
  return { diesel, manut: manut + prev, corr, seguro, total: diesel + manut + prev + corr + seguro };

/** Km por mês de um ônibus: do mês passado, ou estimado. */
function busKmMonth(S, b) {

  if (b.mc && b.mc.cur && b.mc.cur.km) { const d = clamp(S.day - (b.mc.cur.d0 !== undefined ? b.mc.cur.d0 : S.day - dateOf(S.day).d + 1), 0, 31); if (d >= 5) return b.mc.cur.km / d * 30.4; }

/** Efeito de amortizar v num empréstimo: reduzir parcela (mesmo prazo) ou prazo (mesma parcela). */
function amortizePreview(L, v, mode) {
  const bal = Math.max(0, L.bal - v), r = L.rate;
  const totalBefore = L.pay * L.left;
  if (bal <= 1) return { pay: 0, left: 0, monthsLess: L.left, saved: Math.max(0, totalBefore - v) };
  let pay = L.pay, left = L.left;
  if (mode === 'prazo') {
    if (r > 0 && L.pay > bal * r) left = Math.max(1, Math.ceil(-Math.log(1 - bal * r / L.pay) / Math.log(1 + r)));
    else left = Math.max(1, Math.ceil(bal / L.pay));
  } else pay = Math.round(r > 0 ? bal * r / (1 - Math.pow(1 + r, -L.left)) : bal / L.left);
  const saved = Math.max(0, totalBefore - (v + pay * left));

/** Análise de terminais (gerente): por cidade de partida, quanto um terminal próprio economiza no mês

      const o = src[c] = src[c] || { rev: 0, dep: 0 }; o.rev += (L.ema.rev || 0) / 2; o.dep += L.freq + (L.freqN || 0);
    }

/** Participação de mercado: passageiros do jogador / total, no geral e nas rotas onde opera. */
function marketShare(S) {
  const tot = {}; let all = 0;
  for (const c of S.cos) { const h = c.hist[c.hist.length - 1]; const pax = h ? h.pax : 0; tot[c.id] = pax; all += pax; }
  return { all, by: tot, mine: all ? (tot.P || 0) / all : 0 };
}
/** Situação de cada linha para a interface. */
function lineStats(S, L) {
  const r = ROUTES[L.route];
  const occ = L.ema.seats ? L.ema.pax / L.ema.seats : 0;
  const capTrips = planCapacity(S, L, L.buses.filter(id => { const b = busOf(S, id); return b && b.status !== 'parado'; }));
  const bs = L.buses.map(id => busOf(S, id)).filter(Boolean);
  const why = [];
  const np = bs.filter(b => b.status === 'parado').length, nm = bs.filter(b => b.status === 'manut').length;
  if (np) why.push(`${np} ônibus parado(s) na garagem — ative em Frota`);
  if (nm) why.push(`${nm} ônibus na oficina`);
  { const ne = bs.filter(b => b.status === 'entrega'); if (ne.length) why.push(`${ne.length} ônibus a caminho (chega${ne.length > 1 ? 'm' : ''} até ${fmtDate(Math.max(...ne.map(b => b.ready)))})`); }
  const today = (S.plan || []).filter(t => t.line === L.id).length + (S.onRoad || []).filter(t => t.line === L.id).length + S.trips.filter(t => t.line === L.id && t.day === S.day).length;
  const fresh = L.ema.trips < 0.05 && !L.last;
  return { r, occ, paxDay: L.ema.pax, revDay: L.ema.rev, costDay: L.ema.cost, profitDay: L.ema.rev - L.ema.cost, tripsDay: L.ema.trips, maxFreq: Math.floor(capTrips / 2), hours: tripHoursBase(r), why, today, fresh };
}
function competitorsOn(S, rid, exceptCo) {
  return S.lines.filter(l => l.route === rid && l.co !== exceptCo && l.buses.length).map(l => { const c = S.cos.find(x => x.id === l.co); return { co: c, line: l, price: l.price, freq: l.freq, freqN: l.freqN || 0, cat: l.cat, comfort: l.comfortC, occ: l.ema.seats ? l.ema.pax / l.ema.seats : 0 }; });
}
function alerts(S) {
  const P = P0(S), out = [], info = staffInfo(S, P);
  const fleet = S.buses.filter(b => b.co === 'P');
  const burn = monthlyBurn(S, P);
  if (P.cash < 0) out.push({ k: 'bad', t: 'Caixa negativo! Venda ativos, corte custos ou contrate capital de giro.' });
  else if (P.cash < burn * 0.35) out.push({ k: 'warn', t: `Caixa baixo: o fechamento do mês (salários, custos fixos e parcelas ≈ R$ ${Math.round(staffInfo(S, P).payroll + sum(P.loans, l => l.pay)).toLocaleString('pt-BR')}) pode deixar o saldo negativo.` });
  if (P._driverShort && info.driverHours * (P.policy.overtime !== false ? 1.15 : 1) < (P._driverUse || 0)) out.push({ k: 'bad', t: `Faltam motoristas: precisa de ${Math.round(P._driverUse)} h/dia de direção e tem ${Math.round(info.driverHours)} h${P.policy.overtime !== false ? ' (+15% de hora extra)' : ''}. Viagens estão sendo canceladas.` });
  else if (P._ot > 0) out.push({ k: 'warn', t: `Hora extra em uso: ${Math.round(P._ot)} h/dia a 150% do salário. Contrate ~${Math.ceil(P._ot / 5.7)} motorista(s) se isso for durar; hora extra frequente reduz a satisfação.` });
  const lowC = fleet.filter(b => b.cond < 45); if (lowC.length) out.push({ k: 'warn', t: `${lowC.length} ônibus com condição abaixo de 45%: risco alto de panes.` });
  const idle = fleet.filter(b => !b.line && b.status === 'ativo');
  if (idle.length && P.policy.autoSub === false) out.push({ k: 'info', t: `${idle.length} ônibus sem linha. Aloque, frete ou venda — ou ligue "Reserva cobre ônibus na oficina" em Garagem.` });
  const empty = S.lines.filter(l => l.co === 'P' && !l.buses.length); if (empty.length) out.push({ k: 'warn', t: `${empty.length} linha(s) sem ônibus alocado.` });
  for (const L of S.lines.filter(l => l.co === 'P')) { const st = lineStats(S, L); if (L.freq > st.maxFreq && L.buses.length) out.push({ k: 'warn', t: `${placeName(L)}: frequência ${L.freq} acima da capacidade dos ônibus (${st.maxFreq}).` }); if (L.neg >= 2) out.push({ k: 'warn', t: `${placeName(L)} deu prejuízo nos últimos ${L.neg} meses.` }); }
  if (info.adminRatio < 1) out.push({ k: 'warn', t: 'Sobrecarga administrativa: contrate administrativos ou gerentes (custos e atrasos sobem).' });
  if (info.attCov < 0.7) out.push({ k: 'info', t: 'Poucos atendentes para as cidades atendidas: a avaliação dos passageiros cai.' });
  if (!info.n.mecanico) out.push({ k: 'warn', t: 'Sem mecânicos: a garagem não funciona (só oficina terceirizada, 50% mais cara).' });

function tierProgress(S, co) {
  const t = co.tier; if (t >= 5) return null;
  const N = TIERS[t];

  const ufs = new Set(); S.lines.filter(l => l.co === co.id).forEach(l => { ufs.add(CITY[l.a].uf); ufs.add(CITY[l.b].uf); });
  const regs = new Set([...ufs].map(u => UF[u].reg));

/** Horário legível de um instante (dias fracionários do jogo). */
function fmtClock(S, t) {
  const d = Math.floor(t + 1e-9), mins = Math.round((t - d) * 1440);
  const hh = String(Math.floor(mins / 60) % 24).padStart(2, '0'), mm = String(mins % 60).padStart(2, '0');
  const dd = d + Math.floor(mins / 1440);

  const tag = rel === 0 ? 'hoje' : rel === -1 ? 'ontem' : rel === 1 ? 'amanhã' : (['dom','seg','ter','qua','qui','sex','sáb'][dateOf(dd).dow] + ' ' + fmtDate(dd).slice(0, 5));
  return `${tag} ${hh}:${mm}`;
}
/** Onde o ônibus está agora (início do dia S.day, 00:00). */

  if (b.status === 'manut') {
    const j = co && co.garage.jobs.find(x => x.bus === b.id);

const SPEEDS = [2, 0.5, 8 / 60];                    // minutos reais por dia de jogo: ▶ 2 min · ▶▶ 30 s · ▶▶▶ 8 s
const SPEED_NAMES = ['normal', 'rápido', 'muito rápido'];

let running = false, wasRunning = false, lastTs = 0, lastFull = 0, lastHour = -1, lastSave = 0;
function hhmm(t) { const mins = Math.floor((t - Math.floor(t)) * 1440 + 1e-6); return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0'); }
function spd() { return S.spd === undefined ? 1 : S.spd; }
function renderClock() {

  if (S.over) { el.innerHTML = `<button class="btn pri" data-a="newGame">Nova carreira</button>`; return; }
  const cal = PB.calInfo(S.day);

  const ck = `<div class="cal clock"><b><span class="hm">${hhmm(S.t)}</span> · ${['dom','seg','ter','qua','qui','sex','sáb'][cal.dow]} ${PB.fmtDate(S.day).slice(0, 5)}</b><span>${pend ? '<span class="neg">decisão pendente</span>' : running ? SPEED_NAMES[spd()] + (cal.name ? ' · ' + esc(cal.name) : '') : 'pausado' + (cal.name ? ' · ' + esc(cal.name) : '')}</span></div>

      ${[0, 1, 2].map(i => `<button class="${running && spd() === i ? 'on' : ''}" data-a="spd" data-v="${i}" aria-label="Velocidade ${SPEED_NAMES[i]}">${tri(i + 1)}</button>`).join('')}

function setRunning(v) { running = !!v && S && !S.over && !S.pending.length; lastTs = performance.now(); renderClock(); }

/** Alertas do motor: desaceleram para ▶ ou pausam, conforme as configurações. */
function handleNotes() {
  const notes = S.notes.splice(0);
  let slowed = null;
  for (const n of notes) {
    if (n.t && !alertOn(n.t)) continue;
    if (n.k === 'info') { if (!slowed) toast(esc(n.txt), 'ok'); continue; }
    if (running && spd() > 0) { S.spd = 0; slowed = n; }
    else if (!slowed) slowed = n;
  }
  if (slowed) { toast(icon('alert') + ' ' + esc(slowed.txt) + (notes.length > 1 ? ` <span class="mu">(+${notes.length - 1})</span>` : ''), 'bad'); renderClock(); }
}
function step() {
  const now = performance.now(), dt = (now - lastTs) / 1000; lastTs = now;
  if (!S || !running || document.hidden) return;
  const topEv = S.events[0] ? S.events[0].id : null;
  const dDays = Math.min(dt, 2) / (SPEEDS[spd()] * 60);
  let r;
  try { r = PB.tick(S, S.t + dDays); } catch (e) { console.error(e); running = false; toast('Erro na simulação: ' + e.message, 'bad'); return; }
  const fresh = []; for (const e of S.events) { if (e.id === topEv) break; if (!e.choices) fresh.push(e); }
  if (S.notes && S.notes.length) handleNotes();
  if (S._monthClosed) {
    S._monthClosed = false; save();
    if (alertOn('mes') && S.reports[0] && !r.stopped) { running = false; render(); openSheet(reportSheet(0)); renderClock(); toast(`Mês fechado. O relógio pausou para você ver o relatório.`, 'ok'); return; }
    toast(`Mês fechado: <b>relatório de ${PB.MONTHS[S.reports[0] ? S.reports[0].m : 0]}</b> pronto em Relatórios.`, 'ok');
  }
  if (r.stopped) {
    running = false; save();
    if (S.over) { view = 'overview'; render(); toast('Sua empresa faliu.', 'bad'); }
    else if (S.pending.length) { render(); openSheet(eventSheet(S.pending[0].id)); }
  } else if (fresh.length) { st.lastFresh = fresh.slice(0, 4); if (!sheetFn) openSheet(infoEventsSheet(st.lastFresh)); else toast(`${icon('alert')} ${esc(fresh[0].title)} — <a href="#" data-a="showFresh">ver detalhes</a>`, 'bad'); }
  // Atualiza o relógio sempre; a tela inteira só a cada hora de jogo ou quando uma viagem sua termina
  const hour = Math.floor(S.t * 24);
  if (!interacting() && (hour !== lastHour || (S._newTrip && now - lastFull > 2500))) { lastHour = hour; lastFull = now; S._newTrip = 0; render(); drawSheet(); }
  else { const hm = document.querySelector('#adv .hm'); if (hm) hm.textContent = hhmm(S.t); }

function vLinhas() {
  const lines = S.lines.filter(l => l.co === 'P');
  const tab = st.lineTab || 'minhas';
  const openT = (S.tenders || []).filter(t => !t.done);
  let h = `<div class="sec-h"><h2 class="sp">Linhas</h2></div>
    <div class="tabs">${[['minhas', `Minhas linhas (${lines.length})`], ['oport', `Editais${openT.length ? ' (' + openT.length + ')' : ''}`], ['mapa', 'Mapa']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-a="lineTab" data-t="${k}">${l}</button>`).join('')}</div>`;
  if (tab === 'mapa') return h + vMapa();
  if (tab === 'oport') return h + editais();
  if (!lines.length) return h + `<div class="empty">Você não tem concessões. Linhas novas só por licitação.<br><br><button class="btn pri" data-a="lineTab" data-t="oport">Ver editais</button></div>`;
  const tot = PB.sum(lines, l => l.ema.rev - l.ema.cost);
  const rows = lines.map(L => ({ L, s: PB.lineStats(S, L), o: lineOntime(L) }));
  const live = rows.filter(x => !x.s.fresh && x.L.buses.length), occAvg = live.length ? PB.sum(live, x => x.s.occ) / live.length : 0;
  const ot = rows.filter(x => x.o !== null), otAvg = ot.length ? PB.sum(ot, x => x.o) / ot.length : null;
  h += `<div class="card hcard" style="padding:12px"><div class="mini3"><div><span>Resultado/dia</span><b>${sgn(tot)}</b></div><div><span>Ocupação</span><b>${live.length ? pct(occAvg) : '—'}</b></div><div><span>Pontualidade</span><b class="${otAvg !== null && otAvg < 0.85 ? 'neg' : ''}">${otAvg !== null ? pct(otAvg) : '—'}</b></div></div><div class="xs mu" style="margin-top:6px">Resultado e ocupação: média de 2 semanas.</div></div>`;
  const sk = st.lineSort || 'atencao';
  h += `<div class="row xs" style="margin:-2px 0 10px;gap:6px;flex-wrap:wrap"><span class="mu">Ordenar:</span>${[['atencao', 'Atenção'], ['res', 'Resultado'], ['occ', 'Ocupação'], ['venc', 'Vencimento']].map(([k, l]) => `<button class="chip sm ${sk === k ? 'on' : ''}" data-a="lineSort" data-v="${k}">${l}</button>`).join('')}</div>`;
  const problem = x => !x.L.buses.length || x.L.freq > x.s.maxFreq || (!x.s.fresh && x.s.profitDay < 0) || issuesOf(x.L).some(i => i.active && !i.soft) || renewOpen(x.L);
  const SR = { atencao: (a, b) => (problem(b) - problem(a)) || (a.s.profitDay - b.s.profitDay), res: (a, b) => b.s.profitDay - a.s.profitDay, occ: (a, b) => b.s.occ - a.s.occ, venc: (a, b) => ((a.L.conc || {}).end || 1e9) - ((b.L.conc || {}).end || 1e9) };
  rows.sort(SR[sk]);

  return h;
}
/** Pontualidade da linha: mês corrente (se já tem viagens suficientes) ou mês passado. */
function lineOntime(L) { const m = L.mon && L.mon.trips >= 10 ? L.mon : L.last; return m && m.trips ? 1 - (m.late || 0) / m.trips : null; }
/** Edital de renovação aberto, sem proposta sua? Devolve o prazo. */
function renewOpen(L) {
  if (L.conc && L.conc.ret) return null;
  for (const T of (S.tenders || []).filter(t => !t.done)) for (const lot of T.lots) if (lot.routes.some(r => r.renew === L.id) && !lot.bids.some(b => b.co === 'P')) return T.deadline;
  return null;
}
function lineCard(L, s, o, prob) {

    <div class="mini4" style="margin-top:9px"><div><span>Ocupação</span><b class="${!s.fresh && s.occ < 0.5 ? 'acc' : ''}">${s.fresh ? '—' : pct(s.occ)}</b></div><div><span>Pontual.</span><b class="${o !== null && o < 0.85 ? 'neg' : ''}">${o !== null ? pct(o) : '—'}</b></div><div><span>Saídas</span><b>${L.freq}${L.freqN ? '+' + L.freqN + '🌙' : ''}</b></div><div><span>Ônibus</span><b>${L.buses.length}</b></div></div>
    ${badges.filter(Boolean).length ? `<div class="row" style="margin-top:9px;gap:6px;flex-wrap:wrap">${badges.join('')}</div>` : ''}

function dreTable(led) {

function amortSheet() {
  const a = st.am, co = P(), L = a && co.loans.find(l => l.id === a.id); if (!L) return null;
  const cap = Math.min(L.bal, Math.max(0, co.cash));
  const opts = [[50000, '50 mil'], [100000, '100 mil'], [250000, '250 mil'], [L.bal, 'Saldo todo']].filter(([v]) => v <= cap + 0.5);
  if (a.v > cap) a.v = 0;
  const pv = a.v > 0 ? PB.amortizePreview(L, a.v, a.mode) : null;
  let body = `<div class="alert" style="margin-bottom:10px">${esc(L.label)}<br>Saldo ${money(L.bal)} · parcela ${money(L.pay)} · ${L.left} meses · ${nf(L.rate * 100, 2)}% a.m.</div>
    <label class="f">Quanto amortizar (caixa: ${money(co.cash)})</label>
    <div class="chips">${opts.map(([v, l]) => `<button class="chip ${a.v === v ? 'on' : ''}" data-a="amV" data-v="${v}">${l}</button>`).join('') || '<span class="xs mu">Caixa insuficiente para amortizar.</span>'}</div>
    <label class="f">O que reduzir</label>

    <div class="xs mu" style="margin:4px 0 10px">${a.mode === 'parcela' ? 'Mesmo prazo, parcela menor: sobra caixa todo mês.' : 'Mesma parcela, termina antes: economiza mais juros.'}</div>`;
  if (pv) body += `<div class="card" style="margin:0">${pv.left === 0 ? stat('Resultado', 'Contrato quitado') : stat('Nova parcela', money(pv.pay) + (pv.pay < L.pay ? ` <span class="xs ok">(−${money(L.pay - pv.pay)}/mês)</span>` : '')) + stat('Meses restantes', pv.left + (pv.monthsLess ? ` <span class="xs ok">(−${pv.monthsLess})</span>` : ''))}${stat('Juros economizados', money(pv.saved))}</div>`;
  const foot = `<button class="btn" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="amGo" ${pv ? '' : 'disabled'}>Amortizar ${pv ? moneyC(a.v) : ''}</button>`;
  return { title: 'Amortizar', body, foot };
}

/** Proposta de fretamento: o jogador escolhe os ônibus (reserva ou de linhas). */
function charterSheet(e) {

  wizF(d) { st.wiz.freq = Math.max(1, (st.wiz.freq || 1) + (+d.d)); drawSheet(); },
  wizBuy() { st.wizReturn = true; closeSheet(); view = 'mercado'; st.mktTab = 'novos'; render(); window.scrollTo(0, 0); toast('Escolha o ônibus. Depois da compra você volta para a nova linha.'); },
  goLicense(d) { closeSheet(); view = 'mercado'; st.mktTab = 'licencas'; render(); window.scrollTo(0, 0); },
  wizOpen() {
    const w = st.wiz, rid = PB.routeId(w.o, w.d), b = S.buses.find(x => x.id === w.buses[0]);
    const price = w.price || PB.suggestedPrice(S, rid, PB.MODELS[b.model].cat);
    const r = PB.A.openLine(S, w.o, w.d, price, w.freq || 1); if (!r.ok) { toast(r.msg, 'bad'); return; }
    let a = null; for (const id of w.buses) { a = PB.A.assign(S, id, r.line); if (!a.ok) toast(a.msg, 'bad'); }
    closeSheet(); st.wiz = null; view = 'linhas'; st.lineTab = 'minhas'; refresh();
    toast('Linha aberta! ' + (a.msg.split('.').slice(1).join('.').trim() || ''), 'ok');
  },
  trip(d) { openSheet(tripSheet(+d.i)); },
  cands(d) { openSheet(candSheet(d.r)); },
  team(d) { openSheet(teamSheet(d.r)); },
  hire(d) { res(PB.A.hire(S, d.id, d.fast === '1')); },
  pipeAll() { openSheet(() => ({ title: 'A caminho', body: pipelineCard(true) })); },
  cancelBus(d) { st.confirm = null; res(PB.A.cancelBus(S, d.id), () => closeSheet()); },
  cancelHire(d) { st.confirm = null; res(PB.A.cancelHire(S, d.id)); },
  fire(d) { st.confirm = null; res(PB.A.fire(S, d.id)); },
  train(d) { res(PB.A.train(S, d.r)); },
  raise(d) { res(PB.A.raise(S, d.r, 0.05)); },
  expandGarage() { res(PB.A.expandGarage(S)); },
  pol(d) { PB.A.setPolicy(S, d.k, +d.v); refresh(); },
  polT2(d) { PB.A.setPolicy(S, d.k, P().policy[d.k] === false); refresh(); },
  polT(d) { PB.A.setPolicy(S, d.k, !P().policy[d.k]); refresh(); },
  finTab(d) { st.finTab = d.t; render(); },
  finSec(d) { st.finSec = d.t; render(); },
  fleetView(d) { st.fleetView = d.v; render(); },
  askRebalance(d) { res(PB.A.askRebalance(S, d.id)); },
  requestReturn(d) { st.confirm = null; res(PB.A.requestReturn(S, d.id)); },
  cancelExt(d) { st.confirm = null; res(PB.A.cancelExt(S, d.id)); },
  reportApp(d) { res(PB.A.reportApp(S, d.v)); },
  lineSort(d) { st.lineSort = d.v; render(); },
  setLineFocus(d) { res(PB.A.setLineFocus(S, d.id, d.v)); },
  loanAmt(d) { st.loanAmt = +d.v; render(); },
  loanM(d) { st.loanM = +d.v; render(); },
  takeLoan() { res(PB.A.takeLoan(S, st.loanAmt, st.loanM || 24), () => { st.loanAmt = null; }); },
  amortOpen(d) { st.am = { id: d.id, v: 0, mode: 'parcela' }; openSheet(amortSheet); },
  amV(d) { st.am.v = +d.v; drawSheet(); },
  amMode(d) { st.am.mode = d.v; drawSheet(); },
  amGo() { const a = st.am; const r = PB.A.amortize(S, a.id, a.v, a.mode); res(r); if (r.ok) closeSheet(); },
  payLoan(d) { st.confirm = null; res(PB.A.payLoan(S, d.id)); },
  mktTab(d) { st.mktTab = d.t; render(); },
  buyNew(d) { st.buy = null; openSheet(buySheet('new', d.m)); },
  buyUsed(d) { st.buy = null; openSheet(buySheet('used', d.id)); },
  buyDown(d) { st.buy.down = +d.v; drawSheet(); },
  buyM(d) { st.buy.months = +d.v; drawSheet(); },
  buyCash(d) { const r = d.k === 'new' ? PB.A.buyNew(S, d.id, false) : PB.A.buyUsed(S, d.id, false); res(r, afterBuy); },
  buyMode(d) { st.buy.mode = d.v; st.buy.months = null; drawSheet(); },
  buyScrap(d) { st.buy.scrap = d.v || null; drawSheet(); },
  buyGo(d) { const b = st.buy || { mode: 'vista' }, isNew = d.k === 'new', fin = b.mode === 'vista' ? false : b.mode;
    const F = fin ? PB.FIN[fin] : null, months = F ? (isNew ? (F.months.includes(b.months) ? b.months : F.months[F.months.length - 1]) : Math.min(b.months || 36, 48)) : 0;
    const r = isNew ? ((b.qty || 1) > 1 ? PB.A.buyNewBulk(S, d.id, b.qty, fin, months, Math.max(b.down || 0.2, 0.2)) : PB.A.buyNew(S, d.id, fin, months, Math.max(b.down || 0.2, 0.2), { scrap: b.scrap })) : PB.A.buyUsed(S, d.id, fin, months); res(r, afterBuy); },
  buyQty(d) { st.buy.qty = +d.v; if (st.buy.qty > 1) st.buy.scrap = null; drawSheet(); },
  buyFin(d) { const r = d.k === 'new' ? PB.A.buyNew(S, d.id, true, st.buy.months, st.buy.down) : PB.A.buyUsed(S, d.id, true, st.buy.months); res(r, afterBuy); },
  license(d) { res(PB.A.buyLicense(S, d.u)); },
  terminal(d) { res(PB.A.openTerminal(S, d.c)); },
  closeTerminal(d) { st.confirm = null; res(PB.A.closeTerminal(S, d.c)); },
  rival(d) { openSheet(rivalSheet(d.id)); },
  repTab(d) { st.repTab = d.t; render(); },
  report(d) { openSheet(reportSheet(+d.i)); },
  export() { exportSave(); },
  newGame() { closeSheet(); try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = null; running = false; startScreen(); },
  // Tela inicial
  continue() { S = load(); if (S) { view = 'overview'; renderShell(); } },
  color(d) { ns.color = d.c; startScreen(); },
  scen(d) { ns.scen = d.s; startScreen(); },
  start() {
    const name = (ns.name || '').trim() || 'Minha Viação';
    const short = name.split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 3).toUpperCase();
    S = PB.newGame({ scenario: ns.scen, name, short, color: ns.color, seed: (Date.now() ^ Math.floor(Math.random() * 1e9)) & 0x7fffffff });
    save(); view = 'overview'; renderShell(); setRunning(true);
    toast('Carreira iniciada! O relógio já está correndo.', 'ok');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.a; if (!ACT[a]) return;
  if (el.tagName === 'A') e.preventDefault();
  if (a !== 'askConfirm' && !a.startsWith('wiz')) { /* qualquer outra ação cancela confirmações pendentes */ if (st.confirm && !['sellBus', 'closeLine', 'fire', 'payLoan', 'closeTerminal', 'openBase', 'closeBase', 'requestReturn', 'cancelExt', 'newGame'].includes(a)) st.confirm = null; }
  try { ACT[a](el.dataset, el); } catch (err) { console.error(err); toast('Erro: ' + err.message, 'bad'); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'impFile' && el.files[0]) { importSave(el.files[0]); return; }
  const a = el.dataset && el.dataset.a; if (!a) return;
  if (a === 'assignSel') res(PB.A.assign(S, el.dataset.id, el.value || null));
  else if (a === 'mgrSel') res(PB.A.setLineMgr(S, el.dataset.id, el.value || null));
  else if (a === 'line2Sel') res(PB.A.setLine2(S, el.dataset.id, el.value || null));
  else if (a === 'assignTo' && el.value) res(PB.A.assign(S, el.value, el.dataset.line));
  else if (a === 'wizO') { st.wiz.o = el.value || null; st.wiz.d = null; drawSheet(); }
  else if (a === 'wizD') { st.wiz.d = el.value || null; drawSheet(); }
  else if (a === 'opCity') { st.opCity = el.value; render(); }
});
let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => drawCharts(), 150); });
window.addEventListener('beforeunload', () => save());

/* ------------------------------------------------------------------ */
/* INÍCIO                                                               */
/* ------------------------------------------------------------------ */
function boot() {
  const saved = load();
  if (saved && saved.cos[0].active !== false) { S = saved; renderShell(); }
  else startScreen();
}
window.PBUI = { get S() { return S; }, boot, ACT, render, setRunning, get running() { return running; }, get st() { return st; } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
